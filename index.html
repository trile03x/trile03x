<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Mecha Cyber Bug MK-VIII</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .cyber-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.06) 1px, transparent 1px);
    }
    .scan-beam {
      animation: scanSweep 3s linear infinite;
    }
    @keyframes scanSweep {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(700%); }
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-1.5 sm:p-2 select-none">
  <!-- Master Deck Card -->
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl shadow-2xl overflow-hidden relative backdrop-blur-xl">
    
    <!-- Top Cyber Deck Header -->
    <div class="flex items-center justify-between px-3.5 py-2 border-b border-[var(--border)] bg-[var(--background)]/80 text-xs font-mono">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-cyan-400"></span>
        </span>
        <span class="font-bold tracking-wider text-cyan-400 font-mono text-[12px] drop-shadow-[0_0_10px_rgba(0,243,255,0.7)]">
          APEX_MECHA_BUG // MK-VIII TITAN
        </span>
      </div>

      <!-- Controls: Themes, Mode, Sound -->
      <div class="flex items-center gap-1.5">
        <div class="flex items-center bg-[var(--border)]/40 p-0.5 rounded-lg border border-[var(--border)]">
          <button id="themeCyan" class="w-4 h-4 rounded-full bg-cyan-400 border border-white/40 cursor-pointer transition hover:scale-110" title="Cyan Cyberpunk"></button>
          <button id="themeGreen" class="w-4 h-4 rounded-full bg-emerald-400 border border-white/20 cursor-pointer ml-1 transition hover:scale-110" title="Matrix Lime"></button>
          <button id="themeRed" class="w-4 h-4 rounded-full bg-rose-500 border border-white/20 cursor-pointer ml-1 transition hover:scale-110" title="Crimson Phantom"></button>
          <button id="themePurple" class="w-4 h-4 rounded-full bg-purple-400 border border-white/20 cursor-pointer ml-1 transition hover:scale-110" title="Hyper Synthwave"></button>
        </div>

        <button id="modeBtn" class="px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/30 transition text-[11px] cursor-pointer flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
          <span id="modeText">Săn Text Tự Động</span>
        </button>

        <button id="soundBtn" class="px-2 py-1 rounded-md bg-[var(--border)]/50 hover:bg-[var(--border)] text-[var(--muted-foreground)] hover:text-cyan-300 transition text-[11px] cursor-pointer" title="Âm thanh FX">
          🔊
        </button>
      </div>
    </div>

    <!-- Canvas Simulation Stage -->
    <div class="relative w-full h-[335px] cyber-grid bg-[#02050f] overflow-hidden cursor-crosshair">
      <canvas id="bugCanvas" class="w-full h-full block"></canvas>

      <!-- HUD Telemetry Display -->
      <div class="absolute top-2.5 left-3 pointer-events-none text-[11px] font-mono leading-relaxed space-y-0.5 text-slate-300">
        <div class="flex items-center gap-2">
          <span class="text-cyan-400 font-bold">RADAR LOCK:</span>
          <span id="hudTarget" class="text-emerald-400 font-semibold uppercase">[SCANNING SYSTEM]</span>
        </div>
        <div class="flex items-center gap-2 text-[10px] text-slate-400">
          <span>PLASMA REACTOR:</span>
          <span class="text-cyan-300 font-bold font-mono">100% OVERDRIVE</span>
          <span>| DATA:</span>
          <span id="dataScore" class="text-emerald-300 font-bold font-mono">0</span>
        </div>
      </div>

      <!-- Watermark Tip -->
      <div class="absolute bottom-2 right-3 pointer-events-none text-[10px] font-mono text-cyan-400/60 text-right leading-tight">
        <div>⚡ CHẠM/CLICK ĐỂ THẢ THÊM TEXT</div>
        <div>CON BỌ BẬT PHẢN LỰC &amp; PHÓNG SÉT HẤP THỤ</div>
      </div>

      <!-- Scanline Overlay -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-15">
        <div class="w-full h-12 bg-gradient-to-b from-transparent via-cyan-400 to-transparent scan-beam"></div>
      </div>
    </div>

    <!-- Bottom Data Vault Tray -->
    <div class="p-2.5 border-t border-[var(--border)] bg-[var(--background)]/85 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs font-mono">
      <div class="flex items-center gap-2 overflow-x-auto py-0.5 scrollbar-none">
        <span class="text-cyan-400 shrink-0 flex items-center gap-1 font-bold text-[11px]">
          <svg class="w-3.5 h-3.5 text-cyan-400 animate-spin" style="animation-duration: 5s;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6.364 1.636l-.707.707M20 12h-1M17.657 17.657l-.707-.707M12 20v-1m-5.657-.343l.707-.707M4 12h1M6.343 6.343l.707.707"/>
          </svg>
          KHO DỮ LIỆU:
        </span>
        <div id="harvestedVault" class="flex items-center gap-1.5 flex-wrap sm:flex-nowrap">
          <span class="px-2 py-0.5 rounded bg-cyan-950/70 border border-cyan-500/40 text-cyan-300 text-[10.5px]">Reactor_Online</span>
        </div>
      </div>

      <!-- Add Custom Keyword -->
      <div class="flex items-center gap-1 shrink-0">
        <input id="inputKeyword" type="text" placeholder="Nhập từ khóa..." maxlength="20" class="bg-[var(--card)] border border-[var(--border)] rounded px-2.5 py-1 text-xs text-[var(--foreground)] focus:outline-none focus:border-cyan-400 w-28 sm:w-36 font-mono placeholder:text-slate-500">
        <button id="btnFeed" class="bg-gradient-to-r from-cyan-500 to-emerald-400 hover:from-cyan-400 hover:to-emerald-300 text-slate-950 font-bold px-3 py-1 rounded text-xs transition cursor-pointer shadow-md shadow-cyan-500/20">
          Thả Text
        </button>
      </div>
    </div>

  </div>

  <script>
    // --- Audio Sound Synthesizer ---
    let soundEnabled = true;
    let audioCtx = null;
    function playSfx(freq = 600, duration = 0.08, type = 'sine', sweepTo = null) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (sweepTo) {
          osc.frequency.exponentialRampToValueAtTime(sweepTo, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // --- Cyber Color Themes ---
    const themes = {
      cyan: {
        primary: '#00f3ff',
        secondary: '#00ff88',
        core: '#00f3ff',
        accentGlow: 'rgba(0, 243, 255, 0.8)',
        thruster: '#00f3ff'
      },
      green: {
        primary: '#00ff88',
        secondary: '#a3ff00',
        core: '#55ff00',
        accentGlow: 'rgba(0, 255, 136, 0.8)',
        thruster: '#00ff88'
      },
      red: {
        primary: '#ff0055',
        secondary: '#ff8800',
        core: '#ff0033',
        accentGlow: 'rgba(255, 0, 85, 0.8)',
        thruster: '#ff3300'
      },
      purple: {
        primary: '#c084fc',
        secondary: '#06b6d4',
        core: '#e879f9',
        accentGlow: 'rgba(192, 132, 252, 0.8)',
        thruster: '#a855f7'
      }
    };
    let currentTheme = themes.cyan;

    // --- Canvas & DPI Setup ---
    const canvas = document.getElementById('bugCanvas');
    const ctx = canvas.getContext('2d');
    const hudTarget = document.getElementById('hudTarget');
    const dataScoreEl = document.getElementById('dataScore');
    const harvestedVault = document.getElementById('harvestedVault');
    const modeBtn = document.getElementById('modeBtn');
    const modeText = document.getElementById('modeText');
    const soundBtn = document.getElementById('soundBtn');
    const inputKeyword = document.getElementById('inputKeyword');
    const btnFeed = document.getElementById('btnFeed');

    let displayW = 600, displayH = 335;
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      displayW = rect.width;
      displayH = rect.height;
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let currentMode = 'hunt';
    let mouse = { x: displayW / 2, y: displayH / 2, active: false };
    let dataScore = 0;

    const techWords = [
      'Java', 'JavaScript', 'C / C++', 'C#', 'Python', 'TriTechz', 
      'Duy Tan Uni', 'Software Engineer', 'FullStack'
    ];

    let dataPackets = [];
    function spawnDataPacket(text = null, px = null, py = null) {
      const word = text || techWords[Math.floor(Math.random() * techWords.length)];
      dataPackets.push({
        text: word,
        x: px !== null ? px : Math.random() * (displayW - 140) + 70,
        y: py !== null ? py : Math.random() * (displayH - 90) + 45,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45,
        scale: 1,
        dissolving: false,
        dissolveRatio: 0
      });
    }

    for (let i = 0; i < 4; i++) spawnDataPacket();

    let particles = [];
    let electricBolts = [];
    let shockwaves = [];
    let dustParticles = [];
    for (let i = 0; i < 30; i++) {
      dustParticles.push({
        x: Math.random() * 700,
        y: Math.random() * 350,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        size: Math.random() * 1.6 + 0.6,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function triggerHarvestFX(targetX, targetY, sourceX, sourceY) {
      electricBolts.push({
        x1: sourceX, y1: sourceY,
        x2: targetX, y2: targetY,
        life: 18,
        color: currentTheme.primary
      });

      shockwaves.push({
        x: targetX, y: targetY,
        radius: 6,
        maxRadius: 70,
        alpha: 0.95,
        color: currentTheme.primary
      });

      for (let i = 0; i < 24; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1.2;
        particles.push({
          x: targetX, y: targetY,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1,
          decay: Math.random() * 0.035 + 0.02,
          char: Math.random() > 0.5 ? (Math.random() > 0.5 ? '1' : '0') : '◆',
          color: Math.random() > 0.5 ? currentTheme.primary : currentTheme.secondary
        });
      }
    }

    let footRipples = [];
    function addFootRipple(x, y) {
      footRipples.push({
        x, y,
        radius: 2,
        maxRadius: 12,
        alpha: 0.85,
        color: currentTheme.primary
      });
    }

    // --- APEX MECHA TITAN BUG ---
    const titanBug = {
      x: 180,
      y: 170,
      angle: 0,
      speed: 0,
      maxSpeed: 3.0,
      turnSpeed: 0.14,
      targetX: 180,
      targetY: 170,
      pincerAngle: 0,
      coreSpin: 0,

      legs: [],

      init() {
        this.legs = [];
        const configs = [
          { side: -1, offsetAngle: -0.65, reach: 48, restLen: 42, legId: 0 },
          { side:  1, offsetAngle:  0.65, reach: 48, restLen: 42, legId: 1 },
          { side: -1, offsetAngle: -1.55, reach: 52, restLen: 46, legId: 2 },
          { side:  1, offsetAngle:  1.55, reach: 52, restLen: 46, legId: 3 },
          { side: -1, offsetAngle: -2.45, reach: 50, restLen: 44, legId: 4 },
          { side:  1, offsetAngle:  2.45, reach: 50, restLen: 44, legId: 5 }
        ];

        for (const cfg of configs) {
          this.legs.push({
            ...cfg,
            gaitGroup: (cfg.legId === 0 || cfg.legId === 3 || cfg.legId === 4) ? 0 : 1,
            footX: this.x + Math.cos(this.angle + cfg.offsetAngle) * cfg.reach,
            footY: this.y + Math.sin(this.angle + cfg.offsetAngle) * cfg.reach,
            targetFootX: 0,
            targetFootY: 0,
            isStepping: false,
            stepProgress: 0,
            stepHeight: 0
          });
        }
      },

      update() {
        this.coreSpin += 0.06;

        if (currentMode === 'hunt' || !mouse.active) {
          let closest = null;
          let minDist = 999999;
          for (const dp of dataPackets) {
            if (dp.dissolving) continue;
            const d = Math.hypot(dp.x - this.x, dp.y - this.y);
            if (d < minDist) {
              minDist = d;
              closest = dp;
            }
          }
          if (closest) {
            this.targetX = closest.x;
            this.targetY = closest.y;
            hudTarget.textContent = `TARGET: [${closest.text}]`;
            hudTarget.className = 'text-cyan-400 font-bold';
          } else {
            this.targetX = displayW / 2 + Math.cos(Date.now() * 0.0014) * 120;
            this.targetY = displayH / 2 + Math.sin(Date.now() * 0.0018) * 65;
            hudTarget.textContent = 'PATROLLING SECTOR';
            hudTarget.className = 'text-emerald-400 font-semibold';
          }
        } else {
          this.targetX = mouse.x;
          this.targetY = mouse.y;
          hudTarget.textContent = 'MANUAL POINTER TRACK';
          hudTarget.className = 'text-amber-400 font-bold';
        }

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 16) {
          const desiredAngle = Math.atan2(dy, dx);
          let diff = desiredAngle - this.angle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          this.angle += diff * this.turnSpeed;

          this.speed = Math.min(this.maxSpeed, dist * 0.08);
          this.x += Math.cos(this.angle) * this.speed;
          this.y += Math.sin(this.angle) * this.speed;
          // Natural locomotion (no thruster flames)
        } else {
          this.speed = 0;
        }

        this.x = Math.max(45, Math.min(displayW - 45, this.x));
        this.y = Math.max(40, Math.min(displayH - 40, this.y));

        const gaitPhase = Math.floor(Date.now() * 0.009) % 2;

        for (const leg of this.legs) {
          const mountDist = 20;
          const mountX = this.x + Math.cos(this.angle + leg.offsetAngle) * mountDist;
          const mountY = this.y + Math.sin(this.angle + leg.offsetAngle) * mountDist;
          leg.mountX = mountX;
          leg.mountY = mountY;

          const idealX = mountX + Math.cos(this.angle + leg.offsetAngle) * leg.restLen + Math.cos(this.angle) * (this.speed * 8);
          const idealY = mountY + Math.sin(this.angle + leg.offsetAngle) * leg.restLen + Math.sin(this.angle) * (this.speed * 8);

          const footDist = Math.hypot(idealX - leg.footX, idealY - leg.footY);

          if (footDist > 24 && !leg.isStepping && leg.gaitGroup === gaitPhase) {
            leg.isStepping = true;
            leg.stepProgress = 0;
            leg.startFootX = leg.footX;
            leg.startFootY = leg.footY;
            leg.targetFootX = idealX + Math.cos(this.angle) * (this.speed * 6);
            leg.targetFootY = idealY + Math.sin(this.angle) * (this.speed * 6);
          }

          if (leg.isStepping) {
            leg.stepProgress += 0.15;
            if (leg.stepProgress >= 1) {
              leg.isStepping = false;
              leg.footX = leg.targetFootX;
              leg.footY = leg.targetFootY;
              leg.stepHeight = 0;
              addFootRipple(leg.footX, leg.footY);
              if (Math.random() > 0.4) playSfx(200, 0.02, 'square');
            } else {
              const t = leg.stepProgress;
              leg.footX = leg.startFootX + (leg.targetFootX - leg.startFootX) * t;
              leg.footY = leg.startFootY + (leg.targetFootY - leg.startFootY) * t;
              leg.stepHeight = Math.sin(t * Math.PI) * 11;
            }
          }
        }

        let mouthX = this.x + Math.cos(this.angle) * 32;
        let mouthY = this.y + Math.sin(this.angle) * 32;

        for (const dp of dataPackets) {
          if (dp.dissolving) continue;
          const d = Math.hypot(dp.x - mouthX, dp.y - mouthY);
          if (d < 50) {
            dp.dissolving = true;
            this.pincerAngle = 0.55;
            triggerHarvestFX(dp.x, dp.y, mouthX, mouthY);
            playSfx(820, 0.12, 'sawtooth', 1350);

            dataScore += 1;
            dataScoreEl.textContent = dataScore;
            addVaultItem(dp.text);

            setTimeout(() => {
              if (dataPackets.filter(p => !p.dissolving).length < 4) {
                spawnDataPacket();
              }
            }, 1000);
          }
        }

        this.pincerAngle = Math.max(0.12, this.pincerAngle - 0.04);
      },

      draw() {
        // 0. Draw Radar Scanner Cone & Laser Tether
        const mouthX = this.x + Math.cos(this.angle) * 26;
        const mouthY = this.y + Math.sin(this.angle) * 26;
        const coneDist = 120;
        const coneHalfAngle = 0.42;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(mouthX, mouthY);
        ctx.arc(mouthX, mouthY, coneDist, this.angle - coneHalfAngle, this.angle + coneHalfAngle);
        ctx.closePath();
        const coneGrad = ctx.createRadialGradient(mouthX, mouthY, 4, mouthX, mouthY, coneDist);
        coneGrad.addColorStop(0, currentTheme.accentGlow.replace('0.8', '0.4'));
        coneGrad.addColorStop(0.5, currentTheme.accentGlow.replace('0.8', '0.12'));
        coneGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = coneGrad;
        ctx.fill();

        // Laser scan sweep ray
        const sweepAngle = this.angle + Math.sin(Date.now() * 0.005) * coneHalfAngle;
        ctx.strokeStyle = currentTheme.secondary;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(mouthX, mouthY);
        ctx.lineTo(mouthX + Math.cos(sweepAngle) * coneDist, mouthY + Math.sin(sweepAngle) * coneDist);
        ctx.stroke();

        // Target Laser / Web Tether (When in range)
        const dTarget = Math.hypot(this.targetX - mouthX, this.targetY - mouthY);
        if (dTarget < 170) {
          ctx.strokeStyle = currentTheme.primary;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(mouthX, mouthY);
          ctx.lineTo(this.targetX, this.targetY);
          ctx.stroke();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.restore();

        ctx.save();

        // 1. Draw Robotic Hydraulic Limbs
        for (const leg of this.legs) {
          const mx = leg.mountX;
          const my = leg.mountY;
          const fx = leg.footX;
          const fy = leg.footY;

          const midX = (mx + fx) / 2 + Math.cos(this.angle + (leg.side * Math.PI / 2)) * 12;
          const midY = (my + fy) / 2 + Math.sin(this.angle + (leg.side * Math.PI / 2)) * 12 - (leg.stepHeight || 0);

          // Femur heavy carbon casing
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 5.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(midX, midY);
          ctx.stroke();

          // Femur Hydraulic Piston Rod
          ctx.strokeStyle = currentTheme.primary;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(midX, midY);
          ctx.stroke();

          // Knee Rotary Joint
          ctx.fillStyle = '#020617';
          ctx.strokeStyle = currentTheme.secondary;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(midX, midY, 3.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Tibia Curved Talon Blade
          ctx.strokeStyle = currentTheme.primary;
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(midX, midY);
          ctx.lineTo(fx, fy);
          ctx.stroke();

          // Foot Magnet Spark Pad
          ctx.fillStyle = currentTheme.secondary;
          ctx.beginPath();
          ctx.arc(fx, fy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Draw Bug Chassis & Exoskeleton Armor
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Ambient Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.beginPath();
        ctx.ellipse(0, 2, 34, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        // --- SEGMENTED ABDOMEN (3 Layered Plates) ---
        for (let i = 2; i >= 0; i--) {
          const segX = -12 - i * 7;
          const segRx = 18 - i * 2.5;
          const segRy = 14 - i * 2.5;

          ctx.fillStyle = i === 1 ? '#1e293b' : '#0f172a';
          ctx.strokeStyle = currentTheme.primary;
          ctx.lineWidth = 1.6;

          ctx.beginPath();
          ctx.ellipse(segX, 0, segRx, segRy, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // --- CENTER PLASMA ARC REACTOR ---
        ctx.fillStyle = '#020617';
        ctx.strokeStyle = currentTheme.secondary;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(-10, 0, 9.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(-10, 0);
        ctx.rotate(this.coreSpin);
        ctx.fillStyle = currentTheme.core;
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        // 3 Orbiting energy nodules
        for (let a = 0; a < 3; a++) {
          const ang = a * (Math.PI * 2 / 3);
          ctx.beginPath();
          ctx.arc(Math.cos(ang) * 6.5, Math.sin(ang) * 6.5, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // --- THORAX HEAVY SHOULDER ARMOR ---
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = currentTheme.primary;
        ctx.lineWidth = 2.0;

        ctx.beginPath();
        ctx.moveTo(10, -15);
        ctx.lineTo(20, -7);
        ctx.lineTo(20, 7);
        ctx.lineTo(10, 15);
        ctx.lineTo(-5, 13);
        ctx.lineTo(-5, -13);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Hazard chevron inlays
        ctx.strokeStyle = currentTheme.secondary;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(2, -9);
        ctx.lineTo(14, 0);
        ctx.lineTo(2, 9);
        ctx.stroke();

        // --- HEAD SENSOR VISOR POD ---
        ctx.fillStyle = '#050a14';
        ctx.strokeStyle = currentTheme.secondary;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(18, -9);
        ctx.lineTo(30, 0);
        ctx.lineTo(18, 9);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Predator Multi-Lens Optic Matrix
        ctx.fillStyle = currentTheme.secondary;
        ctx.beginPath();
        ctx.arc(22, -4.5, 2.2, 0, Math.PI * 2);
        ctx.arc(22, 4.5, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = currentTheme.primary;
        ctx.beginPath();
        ctx.arc(26, 0, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // --- MECHANICAL PINCERS (MANDIBLES) ---
        ctx.strokeStyle = currentTheme.primary;
        ctx.lineWidth = 2.8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(24, -5);
        ctx.lineTo(34 + Math.cos(-this.pincerAngle) * 7, -10 - Math.sin(this.pincerAngle) * 8);
        ctx.lineTo(40, -3 - this.pincerAngle * 5);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(24, 5);
        ctx.lineTo(34 + Math.cos(this.pincerAngle) * 7, 10 + Math.sin(this.pincerAngle) * 8);
        ctx.lineTo(40, 3 + this.pincerAngle * 5);
        ctx.stroke();

        // Antennae
        ctx.strokeStyle = currentTheme.primary;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(26, -4);
        ctx.lineTo(42, -18);
        ctx.moveTo(26, 4);
        ctx.lineTo(42, 18);
        ctx.stroke();

        ctx.fillStyle = currentTheme.secondary;
        ctx.beginPath();
        ctx.arc(42, -18, 2, 0, Math.PI * 2);
        ctx.arc(42, 18, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    };

    titanBug.init();

    function addVaultItem(text) {
      const tag = document.createElement('span');
      tag.className = 'px-2 py-0.5 rounded bg-cyan-900/60 border border-cyan-400/60 text-cyan-200 text-[10.5px] font-bold animate-pulse shadow-sm';
      tag.textContent = text;
      harvestedVault.prepend(tag);
      if (harvestedVault.children.length > 5) {
        harvestedVault.removeChild(harvestedVault.lastChild);
      }
    }

    function updateCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      mouse.x = clientX - rect.left;
      mouse.y = clientY - rect.top;
      mouse.active = true;
    }

    canvas.addEventListener('mousemove', updateCoords);
    canvas.addEventListener('mouseleave', () => { mouse.active = false; });
    canvas.addEventListener('click', (e) => {
      updateCoords(e);
      spawnDataPacket(null, mouse.x, mouse.y);
      addFootRipple(mouse.x, mouse.y);
      playSfx(520, 0.08, 'sine', 1040);
    });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      updateCoords(e);
      spawnDataPacket(null, mouse.x, mouse.y);
      addFootRipple(mouse.x, mouse.y);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      updateCoords(e);
    }, { passive: false });

    modeBtn.addEventListener('click', () => {
      if (currentMode === 'hunt') {
        currentMode = 'follow';
        modeText.textContent = 'Theo Chuột/Chạm';
        modeBtn.className = 'px-2.5 py-1 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition text-[11px] cursor-pointer flex items-center gap-1';
      } else {
        currentMode = 'hunt';
        modeText.textContent = 'Săn Text Tự Động';
        modeBtn.className = 'px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/30 transition text-[11px] cursor-pointer flex items-center gap-1';
      }
      playSfx(620, 0.06);
    });

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });

    document.getElementById('themeCyan').addEventListener('click', () => { currentTheme = themes.cyan; playSfx(500, 0.05); });
    document.getElementById('themeGreen').addEventListener('click', () => { currentTheme = themes.green; playSfx(600, 0.05); });
    document.getElementById('themeRed').addEventListener('click', () => { currentTheme = themes.red; playSfx(700, 0.05); });
    document.getElementById('themePurple').addEventListener('click', () => { currentTheme = themes.purple; playSfx(800, 0.05); });

    function feedCustom() {
      const val = inputKeyword.value.trim();
      if (val) {
        spawnDataPacket(val);
        inputKeyword.value = '';
        playSfx(680, 0.06);
      }
    }
    btnFeed.addEventListener('click', feedCustom);
    inputKeyword.addEventListener('keypress', (e) => { if (e.key === 'Enter') feedCustom(); });

    // --- MAIN RENDER CYCLE ---
    function animate() {
      ctx.clearRect(0, 0, displayW, displayH);

      // Footprint Ripples
      for (let i = footRipples.length - 1; i >= 0; i--) {
        const r = footRipples[i];
        r.radius += 0.5;
        r.alpha -= 0.035;
        if (r.alpha <= 0) {
          footRipples.splice(i, 1);
          continue;
        }
        ctx.strokeStyle = r.color;
        ctx.globalAlpha = r.alpha;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Floating Ambient Particle Dust
      for (const dp of dustParticles) {
        dp.x += dp.vx;
        dp.y += dp.vy;
        if (dp.x < 0) dp.x = displayW;
        if (dp.x > displayW) dp.x = 0;
        if (dp.y < 0) dp.y = displayH;
        if (dp.y > displayH) dp.y = 0;
        ctx.fillStyle = currentTheme.primary;
        ctx.globalAlpha = dp.alpha;
        ctx.beginPath();
        ctx.arc(dp.x, dp.y, dp.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Shockwave Energy Pulse Rings
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 2.4;
        sw.alpha -= 0.038;
        if (sw.alpha <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = sw.alpha;
        ctx.lineWidth = 2.8 * (1 - sw.radius / sw.maxRadius) + 0.5;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Floating Data Packets
      for (let i = dataPackets.length - 1; i >= 0; i--) {
        const dp = dataPackets[i];
        if (dp.dissolving) {
          dp.dissolveRatio += 0.09;
          dp.scale = 1 + dp.dissolveRatio * 0.9;
          if (dp.dissolveRatio >= 1) {
            dataPackets.splice(i, 1);
            continue;
          }
        } else {
          dp.x += dp.vx;
          dp.y += dp.vy;
          if (dp.x < 50 || dp.x > displayW - 50) dp.vx *= -1;
          if (dp.y < 35 || dp.y > displayH - 35) dp.vy *= -1;
        }

        ctx.save();
        ctx.translate(dp.x, dp.y);
        ctx.scale(dp.scale, dp.scale);
        ctx.globalAlpha = dp.dissolving ? (1 - dp.dissolveRatio) : 0.95;

        ctx.font = 'bold 11.5px monospace';
        const txtW = ctx.measureText(dp.text).width;
        const padX = 9, boxH = 22;
        const boxW = txtW + padX * 2;

        const isTarget = (Math.hypot(dp.x - titanBug.targetX, dp.y - titanBug.targetY) < 5);
        ctx.fillStyle = isTarget ? 'rgba(6, 20, 36, 0.95)' : 'rgba(4, 9, 20, 0.92)';
        ctx.strokeStyle = isTarget ? currentTheme.secondary : currentTheme.primary;
        ctx.lineWidth = isTarget ? 2.2 : 1.4;
        ctx.strokeRect(-boxW / 2, -boxH / 2, boxW, boxH);
        ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);

        // Breathing LED Status dot
        const ledAlpha = 0.5 + Math.sin(Date.now() * 0.006) * 0.45;
        ctx.fillStyle = currentTheme.secondary;
        ctx.globalAlpha = ledAlpha;
        ctx.beginPath();
        ctx.arc(-boxW / 2 + 7, 0, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = dp.dissolving ? (1 - dp.dissolveRatio) : 0.95;

        // Tech corners
        ctx.fillStyle = currentTheme.secondary;
        ctx.fillRect(-boxW / 2, -boxH / 2, 3, 3);
        ctx.fillRect(boxW / 2 - 3, -boxH / 2, 3, 3);
        ctx.fillRect(-boxW / 2, boxH / 2 - 3, 3, 3);
        ctx.fillRect(boxW / 2 - 3, boxH / 2 - 3, 3, 3);

        ctx.fillStyle = currentTheme.primary;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(dp.text, 5, 1);

        if (isTarget) {
          ctx.font = '8px monospace';
          ctx.fillStyle = currentTheme.secondary;
          ctx.fillText('[SYNC: 100% | 8ms]', 0, boxH / 2 + 8);
        }

        ctx.restore();
      }

      // Electric Lightning Bolts
      for (let i = electricBolts.length - 1; i >= 0; i--) {
        const b = electricBolts[i];
        b.life--;
        if (b.life <= 0) {
          electricBolts.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2.5;
        ctx.globalAlpha = b.life / 16;

        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);
        const steps = 7;
        for (let s = 1; s < steps; s++) {
          const ratio = s / steps;
          const px = b.x1 + (b.x2 - b.x1) * ratio + (Math.random() - 0.5) * 18;
          const py = b.y1 + (b.y2 - b.y1) * ratio + (Math.random() - 0.5) * 18;
          ctx.lineTo(px, py);
        }
        ctx.lineTo(b.x2, b.y2);
        ctx.stroke();
        ctx.restore();
      }

      // Update & Draw Titan Bug
      titanBug.update();
      titanBug.draw();

      // Matrix particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.font = '10px monospace';
        ctx.fillText(p.char, p.x, p.y);
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
