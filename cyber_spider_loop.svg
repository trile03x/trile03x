<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgDarkSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="50%" stop-color="#050e20"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- Metallic Carbon Armor Gradient -->
    <linearGradient id="armorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arc Reactor Core Glow -->
    <radialGradient id="reactorCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00f3ff"/>
      <stop offset="70%" stop-color="#0066cc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Predator Eye Optic Glow -->
    <radialGradient id="opticEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanner Radar Cone -->
    <linearGradient id="radarField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Motherboard Neon Trace -->
    <linearGradient id="circuitTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    /* <![CDATA[ */
    /* 8-Leg Spider Tetrapod Gait Step Alternation */
    @keyframes legStepA {
      0%, 100% { transform: rotate(-22deg); }
      50%      { transform: rotate(24deg); }
    }
    @keyframes legStepB {
      0%, 100% { transform: rotate(24deg); }
      50%      { transform: rotate(-22deg); }
    }

    /* Spider Chelicerae (Fangs) Twitch & Snap */
    @keyframes fangTwitchL {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(22deg); }
    }
    @keyframes fangTwitchR {
      0%, 100% { transform: rotate(4deg); }
      50%      { transform: rotate(-22deg); }
    }

    /* Core Arc Reactor Pulse */
    @keyframes corePulseAnim {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50%      { transform: scale(1.3); opacity: 0.7; }
    }

    /* Radar Laser Sweep */
    @keyframes radarSweepAnim {
      0%   { transform: rotate(-26deg); opacity: 0.3; }
      50%  { transform: rotate(30deg); opacity: 0.95; }
      100% { transform: rotate(-26deg); opacity: 0.3; }
    }

    /* Central Cyber Web Pulsing */
    @keyframes webPulse {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 0.8; }
    }

    /* Token Badge Glow Breathing */
    @keyframes tokenGlowBreath {
      0%, 100% { opacity: 0.92; }
      50%      { opacity: 1; }
    }

    .sp-gait-a {
      animation: legStepA 0.32s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .sp-gait-b {
      animation: legStepB 0.32s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .fang-twitch-l {
      animation: fangTwitchL 1.1s ease-in-out infinite alternate;
      transform-origin: 30px -8px;
    }
    .fang-twitch-r {
      animation: fangTwitchR 1.1s ease-in-out infinite alternate;
      transform-origin: 30px 8px;
    }
    .core-pulse-node {
      animation: corePulseAnim 1.2s ease-in-out infinite;
      transform-origin: -14px 0px;
    }
    .radar-sweep-node {
      animation: radarSweepAnim 2.2s ease-in-out infinite;
      transform-origin: 30px 0px;
    }
    .cyber-web-net { animation: webPulse 2.5s ease-in-out infinite; }
    .badge-glow { animation: tokenGlowBreath 2s ease-in-out infinite; }
    /* ]]> */
  </style>

  <!-- Outer Cyber Border Frame -->
  <rect width="920" height="320" rx="16" fill="url(#bgDarkSpace)" stroke="#00f3ff" stroke-opacity="0.4" stroke-width="1.8"/>

  <!-- Perimeter Crawling Rail Track (Guides the spider) -->
  <rect x="110" y="55" width="700" height="210" rx="12" fill="none" stroke="#00f3ff" stroke-opacity="0.2" stroke-dasharray="8,6" stroke-width="1.5"/>

  <!-- Matrix Background Grid -->
  <g opacity="0.06" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="40" x2="920" y2="40"/><line x1="0" y1="80" x2="920" y2="80"/>
    <line x1="0" y1="120" x2="920" y2="120"/><line x1="0" y1="160" x2="920" y2="160"/>
    <line x1="0" y1="200" x2="920" y2="200"/><line x1="0" y1="240" x2="920" y2="240"/>
    <line x1="0" y1="280" x2="920" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Cyber Traces -->
  <path d="M 25 35 L 180 35 L 210 65 L 420 65" stroke="url(#circuitTrace)" stroke-width="1.6" fill="none"/>
  <circle cx="420" cy="65" r="3" fill="#00f3ff"/>
  <path d="M 895 285 L 740 285 L 710 255 L 500 255" stroke="url(#circuitTrace)" stroke-width="1.6" fill="none"/>
  <circle cx="500" cy="255" r="3" fill="#00ff88"/>

  <!-- HUD Labels -->
  <g font-family="'Courier New', monospace" font-size="11.5" fill="#00f3ff" opacity="0.85">
    <text x="30" y="24" font-weight="bold">◈ CYBER_SPIDER // CORE_LANGUAGES_MATRIX</text>
    <text x="735" y="304" font-weight="bold">SYSTEM_ONLINE ◈</text>
  </g>

  <!-- ======================================================= -->
  <!-- CENTER CYBER WEB & PROGRAMMING LANGUAGE TOKENS          -->
  <!-- Java, JavaScript, C, C++, C#, Python, TriTechz          -->
  <!-- ======================================================= -->

  <!-- Interconnecting Laser Web Strands -->
  <g class="cyber-web-net" stroke="#00f3ff" stroke-width="1.2" stroke-dasharray="4,4">
    <!-- Horizontal Web Lines -->
    <line x1="280" y1="125" x2="460" y2="125"/>
    <line x1="460" y1="125" x2="640" y2="125"/>
    <line x1="280" y1="195" x2="460" y2="195"/>
    <line x1="460" y1="195" x2="640" y2="195"/>
    <!-- Vertical Web Lines -->
    <line x1="280" y1="125" x2="280" y2="195"/>
    <line x1="460" y1="125" x2="460" y2="195"/>
    <line x1="640" y1="125" x2="640" y2="195"/>
    <!-- Diagonal Strands to spider rail -->
    <line x1="280" y1="125" x2="160" y2="80"/>
    <line x1="640" y1="125" x2="760" y2="80"/>
    <line x1="280" y1="195" x2="160" y2="240"/>
    <line x1="640" y1="195" x2="760" y2="240"/>
  </g>

  <!-- [ROW 1] Top Row -->
  <!-- Token 1: Java (Orange Amber) -->
  <g transform="translate(280, 125)" class="badge-glow">
    <rect x="-58" y="-14" width="116" height="28" rx="6" fill="#240f04" stroke="#f97316" stroke-width="1.6"/>
    <circle cx="-44" cy="0" r="3.5" fill="#f97316"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12" fill="#fb923c" text-anchor="middle" font-weight="bold">&lt;Java/&gt;</text>
  </g>

  <!-- Token 2: TriTechz (Center Brand - Neon Green) -->
  <g transform="translate(460, 125)" class="badge-glow">
    <rect x="-64" y="-14" width="128" height="28" rx="6" fill="#042616" stroke="#00ff88" stroke-width="1.6"/>
    <circle cx="-50" cy="0" r="3.5" fill="#00ff88"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12.5" fill="#00ff88" text-anchor="middle" font-weight="bold">[TriTechz]</text>
  </g>

  <!-- Token 3: C / C++ (Cyber Cyan/Blue) -->
  <g transform="translate(640, 125)" class="badge-glow">
    <rect x="-58" y="-14" width="116" height="28" rx="6" fill="#061c2c" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="-44" cy="0" r="3.5" fill="#38bdf8"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">&lt;C / C++&gt;</text>
  </g>

  <!-- [ROW 2] Bottom Row -->
  <!-- Token 4: Python (Cyber Cyan) -->
  <g transform="translate(280, 195)" class="badge-glow">
    <rect x="-58" y="-14" width="116" height="28" rx="6" fill="#06182c" stroke="#00f3ff" stroke-width="1.6"/>
    <circle cx="-44" cy="0" r="3.5" fill="#00f3ff"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12" fill="#00f3ff" text-anchor="middle" font-weight="bold">&lt;Python/&gt;</text>
  </g>

  <!-- Token 5: JavaScript (Gold Yellow) -->
  <g transform="translate(460, 195)" class="badge-glow">
    <rect x="-64" y="-14" width="128" height="28" rx="6" fill="#241e04" stroke="#facc15" stroke-width="1.6"/>
    <circle cx="-50" cy="0" r="3.5" fill="#facc15"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12" fill="#facc15" text-anchor="middle" font-weight="bold">&lt;JavaScript/&gt;</text>
  </g>

  <!-- Token 6: C# (Synthwave Violet) -->
  <g transform="translate(640, 195)" class="badge-glow">
    <rect x="-58" y="-14" width="116" height="28" rx="6" fill="#1e0a2d" stroke="#c084fc" stroke-width="1.6"/>
    <circle cx="-44" cy="0" r="3.5" fill="#c084fc"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="bold">&lt;C#&gt;</text>
  </g>

  <!-- ======================================================= -->
  <!-- THE CYBER SPIDER: NATIVE SVG MOTION ALONG RAIL          -->
  <!-- ======================================================= -->
  <g>
    <!-- Native SVG Path Animation: Stays 100% inside viewbox on the rail -->
    <animateMotion 
      path="M 110,55 L 810,55 L 810,265 L 110,265 Z" 
      dur="18s" 
      repeatCount="indefinite" 
      rotate="auto" />

    <!-- Inward Radar Scanner Cone -->
    <g class="radar-sweep-node">
      <polygon points="30,-2 145,-60 160,55" fill="url(#radarField)" opacity="0.4"/>
      <line x1="30" y1="0" x2="150" y2="0" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.9"/>
      <circle cx="130" cy="0" r="6" stroke="#00ff88" stroke-width="1.3" fill="none"/>
      <circle cx="130" cy="0" r="2" fill="#00ff88"/>
    </g>

    <!-- 8 ARTICULATED HYDRAULIC SPIDER LEGS -->

    <!-- [LEG 1] Left Front (A) -->
    <g transform="translate(14, -12)">
      <g class="sp-gait-a">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L 18 -26" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 18 -26" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="18" cy="-26" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M 18 -26 L 40 -38" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="40" cy="-38" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 2] Left Mid-Front (B) -->
    <g transform="translate(4, -15)">
      <g class="sp-gait-b">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L 6 -28" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 6 -28" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="6" cy="-28" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M 6 -28 L 24 -44" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="-44" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 3] Left Mid-Rear (A) -->
    <g transform="translate(-8, -15)">
      <g class="sp-gait-a">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L -8 -28" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -8 -28" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-8" cy="-28" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M -8 -28 L 4 -44" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="4" cy="-44" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 4] Left Rear (B) -->
    <g transform="translate(-18, -12)">
      <g class="sp-gait-b">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L -18 -24" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -18 -24" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-18" cy="-24" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M -18 -24 L -30 -38" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-30" cy="-38" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 5] Right Front (B) -->
    <g transform="translate(14, 12)">
      <g class="sp-gait-b">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L 18 26" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 18 26" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="18" cy="26" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M 18 26 L 40 38" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="40" cy="38" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 6] Right Mid-Front (A) -->
    <g transform="translate(4, 15)">
      <g class="sp-gait-a">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L 6 28" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 6 28" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="6" cy="28" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M 6 28 L 24 44" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="44" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 7] Right Mid-Rear (B) -->
    <g transform="translate(-8, 15)">
      <g class="sp-gait-b">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L -8 28" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -8 28" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-8" cy="28" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M -8 28 L 4 44" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="4" cy="44" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 8] Right Rear (A) -->
    <g transform="translate(-18, 12)">
      <g class="sp-gait-a">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L -18 24" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -18 24" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-18" cy="24" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M -18 24 L -30 38" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-30" cy="38" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- SPIDER CARAPACE BODY (CENTERED AT 0, 0) -->

    <!-- Spider Abdomen (Opisthosoma) -->
    <ellipse cx="-16" cy="0" rx="22" ry="16" fill="url(#armorGradient)" stroke="#00f3ff" stroke-width="2.2"/>
    <line x1="-26" y1="-8" x2="-26" y2="8" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="-20" y1="-12" x2="-20" y2="12" stroke="#00f3ff" stroke-width="1.5"/>

    <!-- Spinneret Arc Reactor Core -->
    <circle cx="-14" cy="0" r="11" fill="#020617" stroke="#00ff88" stroke-width="2"/>
    <circle cx="-14" cy="0" r="8" fill="url(#reactorCoreGlow)" class="core-pulse-node"/>
    <circle cx="-14" cy="0" r="2.8" fill="#ffffff"/>

    <!-- Spider Cephalothorax (Head/Chest Shield) -->
    <polygon points="4,-16 18,-9 18,9 4,16 -8,12 -8,-12" fill="url(#armorGradient)" stroke="#00f3ff" stroke-width="2.4"/>
    <path d="M 0 -9 L 12 0 L 0 9" stroke="#00ff88" stroke-width="1.8" fill="none"/>

    <!-- Predatory 8-Eye Optic Cluster -->
    <circle cx="16" cy="-4" r="3" fill="url(#opticEyeGlow)"/>
    <circle cx="16" cy="4" r="3" fill="url(#opticEyeGlow)"/>
    <circle cx="19" cy="0" r="2" fill="#00f3ff"/>
    <circle cx="11" cy="-7" r="1.6" fill="#ff0055"/>
    <circle cx="11" cy="7" r="1.6" fill="#ff0055"/>
    <circle cx="7" cy="-9" r="1.4" fill="#00ff88"/>
    <circle cx="7" cy="9" r="1.4" fill="#00ff88"/>

    <!-- Articulated Spider Chelicerae (Fangs) -->
    <g class="fang-twitch-l">
      <path d="M 18 -6 L 28 -12 L 32 -4" stroke="#00f3ff" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="32" cy="-4" r="1.8" fill="#00ff88"/>
    </g>
    <g class="fang-twitch-r">
      <path d="M 18 6 L 28 12 L 32 4" stroke="#00f3ff" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="32" cy="4" r="1.8" fill="#00ff88"/>
    </g>

    <!-- Feelers / Pedipalps -->
    <path d="M 18 -3 Q 26 -14 34 -15" stroke="#00f3ff" stroke-width="1.4" fill="none"/>
    <circle cx="34" cy="-15" r="1.8" fill="#00ffcc"/>

    <path d="M 18 3 Q 26 14 34 15" stroke="#00f3ff" stroke-width="1.4" fill="none"/>
    <circle cx="34" cy="15" r="1.8" fill="#00ffcc"/>
  </g>

</svg>
