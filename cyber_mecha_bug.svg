<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Dark Cyber Grid Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#081126"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>

    <!-- Metal Armor Plates Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Core Arc Reactor Glow (Radial for 100% Camo compatibility) -->
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f3ff"/>
      <stop offset="70%" stop-color="#0088ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Sensor Eyes Glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanner Radar Cone -->
    <linearGradient id="scannerCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    /* <![CDATA[ */
    /* Big Crawling Patrol Movement */
    @keyframes crawlLoop {
      0%   { transform: translate(160px, 160px) rotate(4deg); }
      25%  { transform: translate(360px, 120px) rotate(-6deg); }
      50%  { transform: translate(560px, 170px) rotate(8deg); }
      75%  { transform: translate(380px, 200px) rotate(16deg); }
      100% { transform: translate(160px, 160px) rotate(4deg); }
    }

    /* Alternating 6-Leg Tripod Gait (Fast mechanical step) */
    @keyframes legGaitA {
      0%, 100% { transform: rotate(-24deg); }
      50%      { transform: rotate(26deg); }
    }
    @keyframes legGaitB {
      0%, 100% { transform: rotate(26deg); }
      50%      { transform: rotate(-24deg); }
    }

    /* Pincer Mandible Jaws Snapping */
    @keyframes pincerL {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(20deg); }
    }
    @keyframes pincerR {
      0%, 100% { transform: rotate(6deg); }
      50%      { transform: rotate(-20deg); }
    }

    /* Plasma Arc Reactor Breathing */
    @keyframes coreBreath {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50%      { transform: scale(1.4); opacity: 0.5; }
    }

    /* Radar Laser Sweep */
    @keyframes radarSweep {
      0%   { transform: rotate(-30deg); opacity: 0.2; }
      50%  { transform: rotate(35deg); opacity: 0.9; }
      100% { transform: rotate(-30deg); opacity: 0.2; }
    }

    /* Floating Data Text Chips Pulled into Bug */
    @keyframes suckData1 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 0.9; }
      100% { transform: translate(-120px, -45px) scale(0.15); opacity: 0; }
    }
    @keyframes suckData2 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 0.9; }
      100% { transform: translate(-140px, 35px) scale(0.15); opacity: 0; }
    }
    @keyframes suckData3 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 0.9; }
      100% { transform: translate(-110px, -20px) scale(0.1); opacity: 0; }
    }

    .bug-crawler {
      animation: crawlLoop 14s ease-in-out infinite;
      transform-origin: center;
    }
    .tripod-a {
      animation: legGaitA 0.36s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .tripod-b {
      animation: legGaitB 0.36s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .pincer-l {
      animation: pincerL 1.1s ease-in-out infinite alternate;
      transform-origin: 32px -8px;
    }
    .pincer-r {
      animation: pincerR 1.1s ease-in-out infinite alternate;
      transform-origin: 32px 8px;
    }
    .core-pulse {
      animation: coreBreath 1.3s ease-in-out infinite;
      transform-origin: -12px 0px;
    }
    .radar-cone {
      animation: radarSweep 2.2s ease-in-out infinite;
      transform-origin: 32px 0px;
    }
    .chip-1 { animation: suckData1 3s linear infinite; }
    .chip-2 { animation: suckData2 3.8s 1s linear infinite; }
    .chip-3 { animation: suckData3 2.6s 1.8s linear infinite; }
    /* ]]> */
  </style>

  <!-- Background Cyber Canvas -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)" stroke="#00f3ff" stroke-opacity="0.4" stroke-width="2"/>

  <!-- High-Tech Grid Lines -->
  <g opacity="0.07" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/><line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Cyber Circuit Traces & Decals -->
  <path d="M 30 40 L 220 40 L 260 80 L 500 80" stroke="url(#traceGrad)" stroke-width="1.8" fill="none"/>
  <circle cx="500" cy="80" r="3.5" fill="#00f3ff"/>
  <path d="M 900 280 L 680 280 L 640 240 L 400 240" stroke="url(#traceGrad)" stroke-width="1.8" fill="none"/>
  <circle cx="400" cy="240" r="3.5" fill="#00ff88"/>

  <!-- Top-Left & Bottom-Right Cyber HUD Label -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#00f3ff" opacity="0.8">
    <text x="30" y="26" font-weight="bold">// APEX_CYBER_BUG_PROTOCOL v4.0</text>
    <text x="710" y="302" font-weight="bold">STATUS: HUNTING_DATA [ONLINE]</text>
  </g>

  <!-- ======================================================= -->
  <!-- MAIN CYBER BUG (HERO CENTERSTAGE WITH DETAILED LEGS)    -->
  <!-- ======================================================= -->
  <g class="bug-crawler">

    <!-- Radar Scanner Cone (Laser vision scanning field) -->
    <g class="radar-cone">
      <polygon points="32,-2 170,-75 180,70" fill="url(#scannerCone)" opacity="0.4"/>
      <line x1="32" y1="0" x2="175" y2="0" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.9"/>
      <circle cx="150" cy="0" r="8" stroke="#00ff88" stroke-width="1.2" fill="none" opacity="0.8"/>
      <circle cx="150" cy="0" r="2" fill="#00ff88"/>
    </g>

    <!-- 6 HEAVY ARTICULATED HYDRAULIC ROBOT LEGS -->

    <!-- [1] FRONT-LEFT (Tripod A) -->
    <g transform="translate(14, -14)">
      <g class="tripod-a">
        <!-- Joint Servo -->
        <circle cx="0" cy="0" r="5" fill="#0b172a" stroke="#00f3ff" stroke-width="2"/>
        <!-- Upper Femur Segment -->
        <path d="M 0 0 L 18 -30" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 18 -30" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Knee Joint -->
        <circle cx="18" cy="-30" r="4.5" fill="#00f3ff"/>
        <!-- Lower Tibia Carbon Blade Claw -->
        <path d="M 18 -30 L 42 -46" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="42" cy="-46" r="3" fill="#00ff88"/>
      </g>
    </g>

    <!-- [2] MID-LEFT (Tripod B) -->
    <g transform="translate(-6, -18)">
      <g class="tripod-b">
        <circle cx="0" cy="0" r="5" fill="#0b172a" stroke="#00f3ff" stroke-width="2"/>
        <path d="M 0 0 L -4 -32" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -4 -32" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-4" cy="-32" r="4.5" fill="#00f3ff"/>
        <path d="M -4 -32 L 14 -52" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="14" cy="-52" r="3" fill="#00ff88"/>
      </g>
    </g>

    <!-- [3] REAR-LEFT (Tripod A) -->
    <g transform="translate(-26, -14)">
      <g class="tripod-a">
        <circle cx="0" cy="0" r="5" fill="#0b172a" stroke="#00f3ff" stroke-width="2"/>
        <path d="M 0 0 L -20 -26" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -20 -26" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-20" cy="-26" r="4.5" fill="#00f3ff"/>
        <path d="M -20 -26 L -36 -46" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="-36" cy="-46" r="3" fill="#00ff88"/>
      </g>
    </g>

    <!-- [4] FRONT-RIGHT (Tripod B) -->
    <g transform="translate(14, 14)">
      <g class="tripod-b">
        <circle cx="0" cy="0" r="5" fill="#0b172a" stroke="#00f3ff" stroke-width="2"/>
        <path d="M 0 0 L 18 30" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 18 30" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="18" cy="30" r="4.5" fill="#00f3ff"/>
        <path d="M 18 30 L 42 46" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="42" cy="46" r="3" fill="#00ff88"/>
      </g>
    </g>

    <!-- [5] MID-RIGHT (Tripod A) -->
    <g transform="translate(-6, 18)">
      <g class="tripod-a">
        <circle cx="0" cy="0" r="5" fill="#0b172a" stroke="#00f3ff" stroke-width="2"/>
        <path d="M 0 0 L -4 32" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -4 32" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-4" cy="32" r="4.5" fill="#00f3ff"/>
        <path d="M -4 32 L 14 52" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="14" cy="52" r="3" fill="#00ff88"/>
      </g>
    </g>

    <!-- [6] REAR-RIGHT (Tripod B) -->
    <g transform="translate(-26, 14)">
      <g class="tripod-b">
        <circle cx="0" cy="0" r="5" fill="#0b172a" stroke="#00f3ff" stroke-width="2"/>
        <path d="M 0 0 L -20 26" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -20 26" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-20" cy="26" r="4.5" fill="#00f3ff"/>
        <path d="M -20 26 L -36 46" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="-36" cy="46" r="3" fill="#00ff88"/>
      </g>
    </g>

    <!-- BUG CHASSIS & ARMOR PLATES -->

    <!-- Segment 3: Tail Stinger / Exhaust Plate -->
    <path d="M -32 -8 Q -46 0 -32 8 L -24 10 Q -34 0 -24 -10 Z" fill="#0f172a" stroke="#00f3ff" stroke-width="1.8"/>

    <!-- Segment 2: Abdomen Carapace -->
    <ellipse cx="-16" cy="0" rx="24" ry="17" fill="url(#plateGrad)" stroke="#00f3ff" stroke-width="2.2"/>
    <!-- Ventilation Slots -->
    <line x1="-30" y1="-8" x2="-30" y2="8" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="-24" y1="-12" x2="-24" y2="12" stroke="#00f3ff" stroke-width="1.5"/>

    <!-- ARC REACTOR CORE (Glowing Plasma Sphere) -->
    <circle cx="-12" cy="0" r="14" fill="#020617" stroke="#00ff88" stroke-width="2"/>
    <circle cx="-12" cy="0" r="10" fill="url(#reactorGlow)" class="core-pulse"/>
    <circle cx="-12" cy="0" r="3.5" fill="#ffffff"/>

    <!-- Segment 1: Thorax Chest Armor -->
    <polygon points="4,-18 20,-10 20,10 4,18 -8,15 -8,-15" fill="url(#plateGrad)" stroke="#00f3ff" stroke-width="2.4"/>
    <path d="M 0 -11 L 14 0 L 0 11" stroke="#00ff88" stroke-width="1.8" fill="none"/>

    <!-- Head & Sensory Optic Pod -->
    <polygon points="18,-11 34,-4 34,4 18,11" fill="#070d18" stroke="#00ff88" stroke-width="2.2"/>
    
    <!-- Multi-Lens Predator Eyes -->
    <circle cx="28" cy="-5" r="3.5" fill="url(#eyeGlow)"/>
    <circle cx="28" cy="5" r="3.5" fill="url(#eyeGlow)"/>
    <circle cx="32" cy="0" r="2.2" fill="#00f3ff"/>

    <!-- HYDRAULIC MECHANICAL MANDIBLES / PINCERS -->
    <g class="pincer-l">
      <path d="M 32 -6 L 46 -15 L 52 -4" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="52" cy="-4" r="2" fill="#00ff88"/>
    </g>
    <g class="pincer-r">
      <path d="M 32 6 L 46 15 L 52 4" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="52" cy="4" r="2" fill="#00ff88"/>
    </g>

    <!-- Sensory Antennae -->
    <path d="M 32 -5 Q 42 -20 54 -24" stroke="#00f3ff" stroke-width="1.8" fill="none"/>
    <circle cx="54" cy="-24" r="2.5" fill="#00ffcc"/>

    <path d="M 32 5 Q 42 20 54 24" stroke="#00f3ff" stroke-width="1.8" fill="none"/>
    <circle cx="54" cy="24" r="2.5" fill="#00ffcc"/>
  </g>

  <!-- ======================================================= -->
  <!-- FLOATING DATA TEXT CHIPS BEING PULLED / HARVESTED       -->
  <!-- ======================================================= -->
  <g transform="translate(480, 150)">
    <g class="chip-1">
      <rect x="0" y="0" width="85" height="24" rx="5" fill="#07182c" stroke="#00f3ff" stroke-width="1.4"/>
      <circle cx="10" cy="12" r="3" fill="#00f3ff"/>
      <text x="48" y="16" font-family="'Courier New', monospace" font-size="11.5" fill="#00f3ff" text-anchor="middle" font-weight="bold">Python</text>
    </g>
  </g>

  <g transform="translate(520, 220)">
    <g class="chip-2">
      <rect x="0" y="0" width="95" height="24" rx="5" fill="#052818" stroke="#00ff88" stroke-width="1.4"/>
      <circle cx="10" cy="12" r="3" fill="#00ff88"/>
      <text x="54" y="16" font-family="'Courier New', monospace" font-size="11.5" fill="#00ff88" text-anchor="middle" font-weight="bold">TriTechz</text>
    </g>
  </g>

  <g transform="translate(440, 80)">
    <g class="chip-3">
      <rect x="0" y="0" width="90" height="24" rx="5" fill="#260b1e" stroke="#ff0055" stroke-width="1.4"/>
      <circle cx="10" cy="12" r="3" fill="#ff0055"/>
      <text x="50" y="16" font-family="'Courier New', monospace" font-size="11.5" fill="#ff3377" text-anchor="middle" font-weight="bold">#BugFixed</text>
    </g>
  </g>

</svg>
