<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340">
  <defs>
    <!-- Background Space & Cyber Void -->
    <linearGradient id="bgDeepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="35%" stop-color="#060f22"/>
      <stop offset="70%" stop-color="#091636"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- Metallic Carbon Plating Gradient -->
    <linearGradient id="armorMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="titaniumHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Plasma Arc Reactor Radial Bloom -->
    <radialGradient id="arcReactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f3ff"/>
      <stop offset="60%" stop-color="#0088ff" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Predatory Optic Visor Glow -->
    <radialGradient id="opticVisorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00ff88"/>
      <stop offset="75%" stop-color="#00ff88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- Holographic Radar Sweep Gradient -->
    <linearGradient id="holoRadar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#00ff88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Plasma Thruster Flame Gradient -->
    <linearGradient id="ionFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyber Circuit Line -->
    <linearGradient id="circuitNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    /* <![CDATA[ */
    /* Big Crawling Locomotion Across Screen */
    @keyframes sinuousCrawl {
      0%   { transform: translate(140px, 170px) rotate(3deg); }
      20%  { transform: translate(320px, 130px) rotate(-8deg); }
      45%  { transform: translate(540px, 165px) rotate(10deg); }
      70%  { transform: translate(720px, 140px) rotate(-5deg); }
      85%  { transform: translate(450px, 210px) rotate(18deg); }
      100% { transform: translate(140px, 170px) rotate(3deg); }
    }

    /* Hydraulic Leg Tripod Gait Steps */
    @keyframes tripodStepA {
      0%, 100% { transform: rotate(-26deg); }
      50%      { transform: rotate(28deg); }
    }
    @keyframes tripodStepB {
      0%, 100% { transform: rotate(28deg); }
      50%      { transform: rotate(-26deg); }
    }

    /* Pincer Hydraulic Mandible Jaws Snapping */
    @keyframes jawSnapL {
      0%, 100% { transform: rotate(-8deg); }
      50%      { transform: rotate(24deg); }
    }
    @keyframes jawSnapR {
      0%, 100% { transform: rotate(8deg); }
      50%      { transform: rotate(-24deg); }
    }

    /* Core Plasma Energy Pulse */
    @keyframes coreReactorPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.35); opacity: 0.65; }
    }

    /* Holographic Radar Scanner Sweep */
    @keyframes radarHoloScan {
      0%   { transform: rotate(-32deg); opacity: 0.25; }
      50%  { transform: rotate(38deg); opacity: 0.95; }
      100% { transform: rotate(-32deg); opacity: 0.25; }
    }

    /* Thruster Exhaust Flicker */
    @keyframes flameFlicker {
      0%, 100% { transform: scaleX(1); opacity: 0.85; }
      50%      { transform: scaleX(1.4) scaleY(1.2); opacity: 1; }
    }

    /* Data Particle Ingestion Streams */
    @keyframes harvestToken1 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      75%  { opacity: 0.95; }
      100% { transform: translate(-140px, -45px) scale(0.12); opacity: 0; }
    }
    @keyframes harvestToken2 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      75%  { opacity: 0.95; }
      100% { transform: translate(-160px, 35px) scale(0.12); opacity: 0; }
    }
    @keyframes harvestToken3 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      75%  { opacity: 0.95; }
      100% { transform: translate(-130px, -15px) scale(0.1); opacity: 0; }
    }

    .mecha-apex {
      animation: sinuousCrawl 15s ease-in-out infinite;
      transform-origin: center;
    }
    .tripod-a {
      animation: tripodStepA 0.34s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .tripod-b {
      animation: tripodStepB 0.34s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .jaw-l {
      animation: jawSnapL 1.2s ease-in-out infinite alternate;
      transform-origin: 36px -10px;
    }
    .jaw-r {
      animation: jawSnapR 1.2s ease-in-out infinite alternate;
      transform-origin: 36px 10px;
    }
    .reactor-pulse {
      animation: coreReactorPulse 1.2s ease-in-out infinite;
      transform-origin: -14px 0px;
    }
    .radar-holo {
      animation: radarHoloScan 2.4s ease-in-out infinite;
      transform-origin: 36px 0px;
    }
    .thruster-flame {
      animation: flameFlicker 0.15s ease-in-out infinite alternate;
      transform-origin: -42px 0px;
    }
    .token-1 { animation: harvestToken1 3.2s linear infinite; }
    .token-2 { animation: harvestToken2 4.1s 1.2s linear infinite; }
    .token-3 { animation: harvestToken3 2.8s 2s linear infinite; }
    /* ]]> */
  </style>

  <!-- Cyber Chassis Outer Frame -->
  <rect width="960" height="340" rx="18" fill="url(#bgDeepSpace)" stroke="#00f3ff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Matrix Grid Network -->
  <g opacity="0.08" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="40" x2="960" y2="40"/><line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="140" x2="960" y2="140"/><line x1="0" y1="190" x2="960" y2="190"/>
    <line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="290" x2="960" y2="290"/>
    <line x1="80" y1="0" x2="80" y2="340"/><line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="280" y1="0" x2="280" y2="340"/><line x1="380" y1="0" x2="380" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/><line x1="580" y1="0" x2="580" y2="340"/>
    <line x1="680" y1="0" x2="680" y2="340"/><line x1="780" y1="0" x2="780" y2="340"/>
    <line x1="880" y1="0" x2="880" y2="340"/>
  </g>

  <!-- Glowing Motherboard Traces -->
  <path d="M 30 35 L 260 35 L 300 70 L 620 70" stroke="url(#circuitNeon)" stroke-width="2" fill="none"/>
  <circle cx="620" cy="70" r="4" fill="#00f3ff"/>
  <path d="M 930 305 L 700 305 L 660 270 L 340 270" stroke="url(#circuitNeon)" stroke-width="2" fill="none"/>
  <circle cx="340" cy="270" r="4" fill="#00ff88"/>

  <!-- Tech Telemetry HUD Corners -->
  <g font-family="'Courier New', monospace" font-size="11.5" fill="#00f3ff" opacity="0.85">
    <text x="32" y="24" font-weight="bold">◈ APEX_MECHA_ARACHNID // PROTOCOL: HUNTING_DATA</text>
    <text x="740" y="324" font-weight="bold">TARGET_ACQUIRED: [trile03x] ◈</text>
  </g>

  <!-- ======================================================= -->
  <!-- HERO: THE APEX MECHA CYBER BUG (NEXT-GEN DESIGN)        -->
  <!-- ======================================================= -->
  <g class="mecha-apex">

    <!-- Dual Plasma Thrusters Exhaust (Rear Flames) -->
    <g class="thruster-flame">
      <polygon points="-42,-6 -72,0 -42,6" fill="url(#ionFlame)"/>
      <polygon points="-40,-12 -62,-8 -40,-4" fill="url(#ionFlame)" opacity="0.7"/>
      <polygon points="-40,4 -62,8 -40,12" fill="url(#ionFlame)" opacity="0.7"/>
    </g>

    <!-- Holographic Radar Sweep (Scanning Ground) -->
    <g class="radar-holo">
      <polygon points="36,-2 190,-85 205,80" fill="url(#holoRadar)" opacity="0.45"/>
      <line x1="36" y1="0" x2="200" y2="0" stroke="#00f3ff" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.95"/>
      <!-- Concentric Targeting Arcs -->
      <path d="M 120 -35 A 120 120 0 0 1 120 35" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.8"/>
      <path d="M 170 -50 A 170 170 0 0 1 170 50" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="6,4" fill="none" opacity="0.7"/>
      <circle cx="170" cy="0" r="7" stroke="#00ff88" stroke-width="1.5" fill="none"/>
      <circle cx="170" cy="0" r="2.5" fill="#00ff88"/>
    </g>

    <!-- ===================================================== -->
    <!-- 6 ARTICULATED HYDRAULIC MECHANICAL LEGS              -->
    <!-- ===================================================== -->

    <!-- [1] FRONT-LEFT (Tripod A) -->
    <g transform="translate(16, -16)">
      <g class="tripod-a">
        <circle cx="0" cy="0" r="6" fill="#0b172a" stroke="#00f3ff" stroke-width="2.2"/>
        <!-- Femur Heavy Cylinder -->
        <path d="M 0 0 L 22 -34" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
        <path d="M 0 0 L 22 -34" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <!-- Hydraulic Piston Rod -->
        <line x1="4" y1="-8" x2="16" y2="-26" stroke="#94a3b8" stroke-width="2.5"/>
        <!-- Knee Servo Node -->
        <circle cx="22" cy="-34" r="5" fill="#0b172a" stroke="#00ff88" stroke-width="2"/>
        <circle cx="22" cy="-34" r="2" fill="#00ff88"/>
        <!-- Tibia Curved Carbon Blade -->
        <path d="M 22 -34 L 50 -52" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
        <!-- Tarsus Talon Spark Point -->
        <circle cx="50" cy="-52" r="3.5" fill="#00ff88"/>
        <circle cx="50" cy="-52" r="1.5" fill="#ffffff"/>
      </g>
    </g>

    <!-- [2] MID-LEFT (Tripod B) -->
    <g transform="translate(-8, -20)">
      <g class="tripod-b">
        <circle cx="0" cy="0" r="6" fill="#0b172a" stroke="#00f3ff" stroke-width="2.2"/>
        <path d="M 0 0 L -6 -36" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
        <path d="M 0 0 L -6 -36" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <line x1="-2" y1="-8" x2="-4" y2="-28" stroke="#94a3b8" stroke-width="2.5"/>
        <circle cx="-6" cy="-36" r="5" fill="#0b172a" stroke="#00ff88" stroke-width="2"/>
        <circle cx="-6" cy="-36" r="2" fill="#00ff88"/>
        <path d="M -6 -36 L 16 -58" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="16" cy="-58" r="3.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [3] REAR-LEFT (Tripod A) -->
    <g transform="translate(-30, -16)">
      <g class="tripod-a">
        <circle cx="0" cy="0" r="6" fill="#0b172a" stroke="#00f3ff" stroke-width="2.2"/>
        <path d="M 0 0 L -24 -30" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
        <path d="M 0 0 L -24 -30" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <line x1="-6" y1="-8" x2="-18" y2="-22" stroke="#94a3b8" stroke-width="2.5"/>
        <circle cx="-24" cy="-30" r="5" fill="#0b172a" stroke="#00ff88" stroke-width="2"/>
        <circle cx="-24" cy="-30" r="2" fill="#00ff88"/>
        <path d="M -24 -30 L -42 -52" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-42" cy="-52" r="3.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [4] FRONT-RIGHT (Tripod B) -->
    <g transform="translate(16, 16)">
      <g class="tripod-b">
        <circle cx="0" cy="0" r="6" fill="#0b172a" stroke="#00f3ff" stroke-width="2.2"/>
        <path d="M 0 0 L 22 34" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
        <path d="M 0 0 L 22 34" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <line x1="4" y1="8" x2="16" y2="26" stroke="#94a3b8" stroke-width="2.5"/>
        <circle cx="22" cy="34" r="5" fill="#0b172a" stroke="#00ff88" stroke-width="2"/>
        <circle cx="22" cy="34" r="2" fill="#00ff88"/>
        <path d="M 22 34 L 50 52" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="52" r="3.5" fill="#00ff88"/>
        <circle cx="50" cy="52" r="1.5" fill="#ffffff"/>
      </g>
    </g>

    <!-- [5] MID-RIGHT (Tripod A) -->
    <g transform="translate(-8, 20)">
      <g class="tripod-a">
        <circle cx="0" cy="0" r="6" fill="#0b172a" stroke="#00f3ff" stroke-width="2.2"/>
        <path d="M 0 0 L -6 36" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
        <path d="M 0 0 L -6 36" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <line x1="-2" y1="8" x2="-4" y2="28" stroke="#94a3b8" stroke-width="2.5"/>
        <circle cx="-6" cy="36" r="5" fill="#0b172a" stroke="#00ff88" stroke-width="2"/>
        <circle cx="-6" cy="36" r="2" fill="#00ff88"/>
        <path d="M -6 36 L 16 58" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="16" cy="58" r="3.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [6] REAR-RIGHT (Tripod B) -->
    <g transform="translate(-30, 16)">
      <g class="tripod-b">
        <circle cx="0" cy="0" r="6" fill="#0b172a" stroke="#00f3ff" stroke-width="2.2"/>
        <path d="M 0 0 L -24 30" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
        <path d="M 0 0 L -24 30" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <line x1="-6" y1="8" x2="-18" y2="22" stroke="#94a3b8" stroke-width="2.5"/>
        <circle cx="-24" cy="30" r="5" fill="#0b172a" stroke="#00ff88" stroke-width="2"/>
        <circle cx="-24" cy="30" r="2" fill="#00ff88"/>
        <path d="M -24 30 L -42 52" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-42" cy="52" r="3.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- ===================================================== -->
    <!-- MECHA EXOSKELETON ARMOR PLATES & REACTOR              -->
    <!-- ===================================================== -->

    <!-- Segment 3: Tail Propulsion Thruster Housing -->
    <path d="M -36 -10 Q -52 0 -36 10 L -26 12 Q -38 0 -26 -12 Z" fill="url(#titaniumHighlight)" stroke="#00f3ff" stroke-width="2"/>
    <line x1="-42" y1="-5" x2="-42" y2="5" stroke="#00ff88" stroke-width="2"/>

    <!-- Segment 2: Abdomen Heavy Carapace Plating -->
    <ellipse cx="-18" cy="0" rx="28" ry="20" fill="url(#armorMetal)" stroke="#00f3ff" stroke-width="2.6"/>
    <!-- Ventilation Thermal Grids -->
    <line x1="-34" y1="-10" x2="-34" y2="10" stroke="#00ff88" stroke-width="1.8"/>
    <line x1="-28" y1="-14" x2="-28" y2="14" stroke="#00f3ff" stroke-width="1.8"/>
    <line x1="-22" y1="-16" x2="-22" y2="16" stroke="#00f3ff" stroke-width="1.8"/>

    <!-- ARC REACTOR CORE (Pulsing Plasma Well) -->
    <circle cx="-14" cy="0" r="16" fill="#020617" stroke="#00ff88" stroke-width="2.5"/>
    <circle cx="-14" cy="0" r="12" fill="url(#arcReactorGlow)" class="reactor-pulse"/>
    <!-- Orbiting Energy Core Beads -->
    <circle cx="-14" cy="0" r="4.5" fill="#ffffff"/>
    <circle cx="-8" cy="-8" r="2" fill="#00f3ff"/>
    <circle cx="-8" cy="8" r="2" fill="#00f3ff"/>

    <!-- Segment 1: Thorax Heavy Shoulder Armor -->
    <polygon points="6,-22 24,-12 24,12 6,22 -10,18 -10,-18" fill="url(#titaniumHighlight)" stroke="#00f3ff" stroke-width="2.8"/>
    <!-- Hazard Tech Inlays -->
    <path d="M 2 -14 L 18 0 L 2 14" stroke="#00ff88" stroke-width="2.2" fill="none"/>
    <circle cx="10" cy="0" r="3" fill="#00f3ff"/>

    <!-- Head & Predatory Skull Visor -->
    <polygon points="22,-13 40,-5 40,5 22,13" fill="#050a14" stroke="#00ff88" stroke-width="2.6"/>

    <!-- 6-Lens Predator Optics Sensor Cluster -->
    <circle cx="34" cy="-6" r="4" fill="url(#opticVisorGlow)"/>
    <circle cx="34" cy="6" r="4" fill="url(#opticVisorGlow)"/>
    <circle cx="38" cy="0" r="2.8" fill="#00f3ff"/>
    <circle cx="28" cy="-8" r="1.8" fill="#ff0055"/>
    <circle cx="28" cy="8" r="1.8" fill="#ff0055"/>

    <!-- ARTICULATED HYDRAULIC MANDIBLES (JAWS) -->
    <g class="jaw-l">
      <path d="M 36 -8 L 54 -18 L 62 -5" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <circle cx="62" cy="-5" r="2.5" fill="#00ff88"/>
    </g>
    <g class="jaw-r">
      <path d="M 36 8 L 54 18 L 62 5" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <circle cx="62" cy="5" r="2.5" fill="#00ff88"/>
    </g>

    <!-- Articulated Sensory Antennae with Pulse Nodes -->
    <path d="M 38 -6 Q 50 -24 66 -28" stroke="#00f3ff" stroke-width="2.2" fill="none"/>
    <circle cx="66" cy="-28" r="3" fill="#00ffcc"/>

    <path d="M 38 6 Q 50 24 66 28" stroke="#00f3ff" stroke-width="2.2" fill="none"/>
    <circle cx="66" cy="28" r="3" fill="#00ffcc"/>
  </g>

  <!-- ======================================================= -->
  <!-- FLOATING DATA TEXT CHIPS BEING PULLED / HARVESTED       -->
  <!-- ======================================================= -->
  <g transform="translate(520, 160)">
    <g class="token-1">
      <rect x="0" y="0" width="95" height="26" rx="6" fill="#06162a" stroke="#00f3ff" stroke-width="1.6"/>
      <circle cx="12" cy="13" r="3.5" fill="#00f3ff"/>
      <text x="54" y="17.5" font-family="'Courier New', monospace" font-size="12" fill="#00f3ff" text-anchor="middle" font-weight="bold">Python3</text>
    </g>
  </g>

  <g transform="translate(560, 240)">
    <g class="token-2">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#042616" stroke="#00ff88" stroke-width="1.6"/>
      <circle cx="12" cy="13" r="3.5" fill="#00ff88"/>
      <text x="60" y="17.5" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" text-anchor="middle" font-weight="bold">TriTechz</text>
    </g>
  </g>

  <g transform="translate(480, 85)">
    <g class="token-3">
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#2b091f" stroke="#ff0077" stroke-width="1.6"/>
      <circle cx="12" cy="13" r="3.5" fill="#ff0077"/>
      <text x="56" y="17.5" font-family="'Courier New', monospace" font-size="12" fill="#ff3388" text-anchor="middle" font-weight="bold">#BugFixed</text>
    </g>
  </g>

</svg>
