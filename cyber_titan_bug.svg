<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320">
  <defs>
    <!-- Deep Space Cyber Void Background -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="40%" stop-color="#050e20"/>
      <stop offset="75%" stop-color="#081533"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- Heavy Titanium Carbon Armor Gradients -->
    <linearGradient id="armorChitin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="titaniumEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Arc Reactor Plasma Multi-Ring Core -->
    <radialGradient id="plasmaReactor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#00f3ff"/>
      <stop offset="55%" stop-color="#0077ff" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#00ff88" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Predator Visor Optic Lens -->
    <radialGradient id="predatorLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00ff88"/>
      <stop offset="75%" stop-color="#00b359"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- Ion Thruster Flame -->
    <linearGradient id="thrusterPlume" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Holographic Radar Sweep -->
    <linearGradient id="radarHoloField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#00ff88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Circuit Trace Neon Glow -->
    <linearGradient id="neonTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    /* <![CDATA[ */
    /* Big Patrol Movement: Sinuous Crawling across the canvas */
    @keyframes titanPatrol {
      0%   { transform: translate(120px, 160px) rotate(3deg); }
      22%  { transform: translate(280px, 120px) rotate(-7deg); }
      48%  { transform: translate(500px, 165px) rotate(8deg); }
      72%  { transform: translate(680px, 135px) rotate(-4deg); }
      86%  { transform: translate(400px, 205px) rotate(16deg); }
      100% { transform: translate(120px, 160px) rotate(3deg); }
    }

    /* Powerful Tripod Gait Step Cycles (Heavy Hydraulic Reciprocation) */
    @keyframes heavyStepA {
      0%, 100% { transform: rotate(-26deg); }
      50%      { transform: rotate(28deg); }
    }
    @keyframes heavyStepB {
      0%, 100% { transform: rotate(28deg); }
      50%      { transform: rotate(-26deg); }
    }

    /* Pincer Mandibles Snap & Crush */
    @keyframes mandibleSnapL {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(26deg); }
    }
    @keyframes mandibleSnapR {
      0%, 100% { transform: rotate(6deg); }
      50%      { transform: rotate(-26deg); }
    }

    /* Arc Reactor Core Pulsing & Breathing */
    @keyframes reactorCoreGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.35); opacity: 0.65; }
    }

    /* Radar Laser Sweep */
    @keyframes radarSweepScan {
      0%   { transform: rotate(-32deg); opacity: 0.3; }
      50%  { transform: rotate(38deg); opacity: 0.95; }
      100% { transform: rotate(-32deg); opacity: 0.3; }
    }

    /* Plasma Thruster Flame Flicker */
    @keyframes thrusterFlicker {
      0%, 100% { transform: scaleX(1); opacity: 0.9; }
      50%      { transform: scaleX(1.4) scaleY(1.25); opacity: 1; }
    }

    /* Floating Data Text Chips Suction Streams */
    @keyframes suckToken1 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      75%  { opacity: 0.95; }
      100% { transform: translate(-150px, -45px) scale(0.12); opacity: 0; }
    }
    @keyframes suckToken2 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      75%  { opacity: 0.95; }
      100% { transform: translate(-170px, 35px) scale(0.12); opacity: 0; }
    }
    @keyframes suckToken3 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      75%  { opacity: 0.95; }
      100% { transform: translate(-140px, -15px) scale(0.1); opacity: 0; }
    }

    .bug-titan {
      animation: titanPatrol 14s ease-in-out infinite;
      transform-origin: center;
    }
    .step-a {
      animation: heavyStepA 0.34s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .step-b {
      animation: heavyStepB 0.34s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .mandible-l {
      animation: mandibleSnapL 1.1s ease-in-out infinite alternate;
      transform-origin: 40px -12px;
    }
    .mandible-r {
      animation: mandibleSnapR 1.1s ease-in-out infinite alternate;
      transform-origin: 40px 12px;
    }
    .core-pulse {
      animation: reactorCoreGlow 1.2s ease-in-out infinite;
      transform-origin: -16px 0px;
    }
    .radar-beam-group {
      animation: radarSweepScan 2.3s ease-in-out infinite;
      transform-origin: 40px 0px;
    }
    .flame-anim {
      animation: thrusterFlicker 0.14s ease-in-out infinite alternate;
      transform-origin: -48px 0px;
    }
    .harvest-token-1 { animation: suckToken1 3.2s linear infinite; }
    .harvest-token-2 { animation: suckToken2 4s 1.2s linear infinite; }
    .harvest-token-3 { animation: suckToken3 2.7s 2.1s linear infinite; }
    /* ]]> */
  </style>

  <!-- Cyber Deck Base Border Frame -->
  <rect width="920" height="320" rx="18" fill="url(#bgObsidian)" stroke="#00f3ff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Futuristic Background Grid -->
  <g opacity="0.08" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="40" x2="920" y2="40"/><line x1="0" y1="80" x2="920" y2="80"/>
    <line x1="0" y1="120" x2="920" y2="120"/><line x1="0" y1="160" x2="920" y2="160"/>
    <line x1="0" y1="200" x2="920" y2="200"/><line x1="0" y1="240" x2="920" y2="240"/>
    <line x1="0" y1="280" x2="920" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="320"/><line x1="180" y1="0" x2="180" y2="320"/>
    <line x1="280" y1="0" x2="280" y2="320"/><line x1="380" y1="0" x2="380" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/><line x1="580" y1="0" x2="580" y2="320"/>
    <line x1="680" y1="0" x2="680" y2="320"/><line x1="780" y1="0" x2="780" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/>
  </g>

  <!-- Glowing Motherboard Traces -->
  <path d="M 30 35 L 260 35 L 300 65 L 600 65" stroke="url(#neonTrace)" stroke-width="2" fill="none"/>
  <circle cx="600" cy="65" r="4" fill="#00f3ff"/>
  <path d="M 890 285 L 680 285 L 640 255 L 340 255" stroke="url(#neonTrace)" stroke-width="2" fill="none"/>
  <circle cx="340" cy="255" r="4" fill="#00ff88"/>

  <!-- Cyber HUD Banner Tags -->
  <g font-family="'Courier New', monospace" font-size="12" fill="#00f3ff" opacity="0.9">
    <text x="32" y="24" font-weight="bold">◈ APEX_TITAN_BUG // MK-VIII OVERDRIVE</text>
    <text x="705" y="304" font-weight="bold">STATUS: HARVESTING_DATA ◈</text>
  </g>

  <!-- ======================================================= -->
  <!-- HERO: APEX CYBER MECHA TITAN BUG (LARGE & DETAILED)     -->
  <!-- ======================================================= -->
  <g class="bug-titan">

    <!-- Dual Plasma Thrusters Exhaust Flames -->
    <g class="flame-anim">
      <polygon points="-48,-7 -82,0 -48,7" fill="url(#thrusterPlume)"/>
      <polygon points="-46,-14 -72,-9 -46,-5" fill="url(#thrusterPlume)" opacity="0.75"/>
      <polygon points="-46,5 -72,9 -46,14" fill="url(#thrusterPlume)" opacity="0.75"/>
      <!-- Core White Flame Spike -->
      <polygon points="-48,-3 -64,0 -48,3" fill="#ffffff"/>
    </g>

    <!-- Holographic Radar Sweep Field -->
    <g class="radar-beam-group">
      <polygon points="40,-2 210,-95 225,90" fill="url(#radarHoloField)" opacity="0.5"/>
      <line x1="40" y1="0" x2="220" y2="0" stroke="#00f3ff" stroke-width="2" stroke-dasharray="6,4" opacity="0.95"/>
      <!-- Concentric Targeting Arcs -->
      <path d="M 130 -40 A 130 130 0 0 1 130 40" stroke="#00ff88" stroke-width="1.8" fill="none" opacity="0.85"/>
      <path d="M 185 -60 A 185 185 0 0 1 185 60" stroke="#00f3ff" stroke-width="1.8" stroke-dasharray="6,4" fill="none" opacity="0.75"/>
      <circle cx="185" cy="0" r="8" stroke="#00ff88" stroke-width="1.8" fill="none"/>
      <circle cx="185" cy="0" r="3" fill="#00ff88"/>
    </g>

    <!-- ======================================================= -->
    <!-- 6 HEAVY ARTICULATED HYDRAULIC MECHANICAL LEGS          -->
    <!-- ======================================================= -->

    <!-- [1] FRONT-LEFT (Step A) -->
    <g transform="translate(18, -18)">
      <g class="step-a">
        <!-- Hip Coxa Rotary Servo -->
        <circle cx="0" cy="0" r="7" fill="#0b172a" stroke="#00f3ff" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="3" fill="#00f3ff"/>
        <!-- Upper Femur Segment with Hydraulic Cylinder -->
        <path d="M 0 0 L 26 -38" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
        <path d="M 0 0 L 26 -38" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="5" y1="-9" x2="19" y2="-29" stroke="#94a3b8" stroke-width="3"/>
        <!-- Knee Rotary Joint -->
        <circle cx="26" cy="-38" r="6" fill="#0b172a" stroke="#00ff88" stroke-width="2.5"/>
        <circle cx="26" cy="-38" r="2.5" fill="#00ff88"/>
        <!-- Lower Tibia Curved Carbon Blade -->
        <path d="M 26 -38 L 58 -58" stroke="#00f3ff" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Foot Tarsus Magnet Pad -->
        <circle cx="58" cy="-58" r="4" fill="#00ff88"/>
        <circle cx="58" cy="-58" r="1.8" fill="#ffffff"/>
      </g>
    </g>

    <!-- [2] MID-LEFT (Step B) -->
    <g transform="translate(-10, -22)">
      <g class="step-b">
        <circle cx="0" cy="0" r="7" fill="#0b172a" stroke="#00f3ff" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="3" fill="#00f3ff"/>
        <path d="M 0 0 L -8 -40" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
        <path d="M 0 0 L -8 -40" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="-2" y1="-9" x2="-6" y2="-31" stroke="#94a3b8" stroke-width="3"/>
        <circle cx="-8" cy="-40" r="6" fill="#0b172a" stroke="#00ff88" stroke-width="2.5"/>
        <circle cx="-8" cy="-40" r="2.5" fill="#00ff88"/>
        <path d="M -8 -40 L 18 -66" stroke="#00f3ff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="18" cy="-66" r="4" fill="#00ff88"/>
      </g>
    </g>

    <!-- [3] REAR-LEFT (Step A) -->
    <g transform="translate(-34, -18)">
      <g class="step-a">
        <circle cx="0" cy="0" r="7" fill="#0b172a" stroke="#00f3ff" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="3" fill="#00f3ff"/>
        <path d="M 0 0 L -28 -34" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
        <path d="M 0 0 L -28 -34" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="-7" y1="-9" x2="-21" y2="-25" stroke="#94a3b8" stroke-width="3"/>
        <circle cx="-28" cy="-34" r="6" fill="#0b172a" stroke="#00ff88" stroke-width="2.5"/>
        <circle cx="-28" cy="-34" r="2.5" fill="#00ff88"/>
        <path d="M -28 -34 L -48 -58" stroke="#00f3ff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="-48" cy="-58" r="4" fill="#00ff88"/>
      </g>
    </g>

    <!-- [4] FRONT-RIGHT (Step B) -->
    <g transform="translate(18, 18)">
      <g class="step-b">
        <circle cx="0" cy="0" r="7" fill="#0b172a" stroke="#00f3ff" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="3" fill="#00f3ff"/>
        <path d="M 0 0 L 26 38" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
        <path d="M 0 0 L 26 38" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="5" y1="9" x2="19" y2="29" stroke="#94a3b8" stroke-width="3"/>
        <circle cx="26" cy="38" r="6" fill="#0b172a" stroke="#00ff88" stroke-width="2.5"/>
        <circle cx="26" cy="38" r="2.5" fill="#00ff88"/>
        <path d="M 26 38 L 58 58" stroke="#00f3ff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="58" cy="58" r="4" fill="#00ff88"/>
        <circle cx="58" cy="58" r="1.8" fill="#ffffff"/>
      </g>
    </g>

    <!-- [5] MID-RIGHT (Step A) -->
    <g transform="translate(-10, 22)">
      <g class="step-a">
        <circle cx="0" cy="0" r="7" fill="#0b172a" stroke="#00f3ff" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="3" fill="#00f3ff"/>
        <path d="M 0 0 L -8 40" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
        <path d="M 0 0 L -8 40" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="-2" y1="9" x2="-6" y2="31" stroke="#94a3b8" stroke-width="3"/>
        <circle cx="-8" cy="40" r="6" fill="#0b172a" stroke="#00ff88" stroke-width="2.5"/>
        <circle cx="-8" cy="40" r="2.5" fill="#00ff88"/>
        <path d="M -8 40 L 18 66" stroke="#00f3ff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="18" cy="66" r="4" fill="#00ff88"/>
      </g>
    </g>

    <!-- [6] REAR-RIGHT (Step B) -->
    <g transform="translate(-34, 18)">
      <g class="step-b">
        <circle cx="0" cy="0" r="7" fill="#0b172a" stroke="#00f3ff" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="3" fill="#00f3ff"/>
        <path d="M 0 0 L -28 34" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
        <path d="M 0 0 L -28 34" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="-7" y1="9" x2="-21" y2="25" stroke="#94a3b8" stroke-width="3"/>
        <circle cx="-28" cy="34" r="6" fill="#0b172a" stroke="#00ff88" stroke-width="2.5"/>
        <circle cx="-28" cy="34" r="2.5" fill="#00ff88"/>
        <path d="M -28 34 L -48 58" stroke="#00f3ff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="-48" cy="58" r="4" fill="#00ff88"/>
      </g>
    </g>

    <!-- ======================================================= -->
    <!-- TITAN EXOSKELETON ARMOR CARAPACE & PLASMA CORE          -->
    <!-- ======================================================= -->

    <!-- Tail Exhaust Cowling -->
    <path d="M -40 -12 Q -58 0 -40 12 L -28 14 Q -42 0 -28 -14 Z" fill="url(#titaniumEdge)" stroke="#00f3ff" stroke-width="2.2"/>
    <line x1="-46" y1="-6" x2="-46" y2="6" stroke="#00ff88" stroke-width="2.2"/>

    <!-- Abdomen Heavy Armor Shell -->
    <ellipse cx="-20" cy="0" rx="32" ry="23" fill="url(#armorChitin)" stroke="#00f3ff" stroke-width="2.8"/>
    <!-- Heat Dissipation Slots -->
    <line x1="-38" y1="-12" x2="-38" y2="12" stroke="#00ff88" stroke-width="2"/>
    <line x1="-31" y1="-16" x2="-31" y2="16" stroke="#00f3ff" stroke-width="2"/>
    <line x1="-24" y1="-19" x2="-24" y2="19" stroke="#00f3ff" stroke-width="2"/>

    <!-- PLASMA ARC REACTOR CORE (Multilayered Halo) -->
    <circle cx="-16" cy="0" r="18" fill="#020617" stroke="#00ff88" stroke-width="2.8"/>
    <circle cx="-16" cy="0" r="14" fill="url(#plasmaReactor)" class="core-pulse"/>
    <!-- Rotating Energy Nodes -->
    <circle cx="-16" cy="0" r="5" fill="#ffffff"/>
    <circle cx="-10" cy="-9" r="2.5" fill="#00f3ff"/>
    <circle cx="-10" cy="9" r="2.5" fill="#00f3ff"/>

    <!-- Thorax Heavy Shoulder Carapace -->
    <polygon points="8,-25 28,-14 28,14 8,25 -12,20 -12,-20" fill="url(#titaniumEdge)" stroke="#00f3ff" stroke-width="3"/>
    <!-- Hazard Tech Chevron Inlays -->
    <path d="M 4 -16 L 22 0 L 4 16" stroke="#00ff88" stroke-width="2.5" fill="none"/>
    <circle cx="12" cy="0" r="3.5" fill="#00f3ff"/>

    <!-- Head & Predatory Skull Visor -->
    <polygon points="26,-15 46,-6 46,6 26,15" fill="#040914" stroke="#00ff88" stroke-width="2.8"/>

    <!-- 6-Lens Predator Optics Matrix -->
    <circle cx="38" cy="-7" r="4.5" fill="url(#predatorLens)"/>
    <circle cx="38" cy="7" r="4.5" fill="url(#predatorLens)"/>
    <circle cx="43" cy="0" r="3.2" fill="#00f3ff"/>
    <circle cx="31" cy="-9" r="2" fill="#ff0055"/>
    <circle cx="31" cy="9" r="2" fill="#ff0055"/>

    <!-- ARTICULATED HYDRAULIC MANDIBLES (JAWS) -->
    <g class="mandible-l">
      <path d="M 40 -9 L 60 -21 L 70 -6" stroke="#00f3ff" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="70" cy="-6" r="3" fill="#00ff88"/>
    </g>
    <g class="mandible-r">
      <path d="M 40 9 L 60 21 L 70 6" stroke="#00f3ff" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="70" cy="6" r="3" fill="#00ff88"/>
    </g>

    <!-- Articulated Sensory Antennae with Glow Pods -->
    <path d="M 42 -7 Q 56 -28 74 -32" stroke="#00f3ff" stroke-width="2.4" fill="none"/>
    <circle cx="74" cy="-32" r="3.5" fill="#00ffcc"/>

    <path d="M 42 7 Q 56 28 74 32" stroke="#00f3ff" stroke-width="2.4" fill="none"/>
    <circle cx="74" cy="32" r="3.5" fill="#00ffcc"/>
  </g>

  <!-- ======================================================= -->
  <!-- FLOATING DATA TEXT TOKENS BEING HARVESTED               -->
  <!-- ======================================================= -->
  <g transform="translate(500, 155)">
    <g class="harvest-token-1">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#06162a" stroke="#00f3ff" stroke-width="1.8"/>
      <circle cx="14" cy="14" r="4" fill="#00f3ff"/>
      <text x="60" y="19" font-family="'Courier New', monospace" font-size="13" fill="#00f3ff" text-anchor="middle" font-weight="bold">Python3</text>
    </g>
  </g>

  <g transform="translate(540, 235)">
    <g class="harvest-token-2">
      <rect x="0" y="0" width="115" height="28" rx="6" fill="#042616" stroke="#00ff88" stroke-width="1.8"/>
      <circle cx="14" cy="14" r="4" fill="#00ff88"/>
      <text x="66" y="19" font-family="'Courier New', monospace" font-size="13" fill="#00ff88" text-anchor="middle" font-weight="bold">TriTechz</text>
    </g>
  </g>

  <g transform="translate(460, 80)">
    <g class="harvest-token-3">
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#2b091f" stroke="#ff0077" stroke-width="1.8"/>
      <circle cx="14" cy="14" r="4" fill="#ff0077"/>
      <text x="62" y="19" font-family="'Courier New', monospace" font-size="13" fill="#ff3388" text-anchor="middle" font-weight="bold">#BugFixed</text>
    </g>
  </g>

</svg>
