<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320">
  <defs>
    <!-- Dark Cyber Grid Background -->
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="50%" stop-color="#050e20"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- Titanium Carbon Armor Gradient -->
    <linearGradient id="chitinMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Core Arc Reactor Radial Glow -->
    <radialGradient id="spiderCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f3ff"/>
      <stop offset="70%" stop-color="#0066cc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Predatory Spider Optic Eye Cluster -->
    <radialGradient id="spiderEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Scanner Cone Gradient -->
    <linearGradient id="radarScanCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="borderTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    /* <![CDATA[ */
    /* Exact Perimeter Crawling: Spider walks along Top -> Right -> Bottom -> Left -> Top */
    @keyframes crawlPerimeter {
      0%   { transform: translate(90px, 55px) rotate(0deg); }
      34%  { transform: translate(830px, 55px) rotate(0deg); }     /* End of Top border */
      38%  { transform: translate(830px, 55px) rotate(90deg); }    /* Turn Down */
      46%  { transform: translate(830px, 265px) rotate(90deg); }   /* End of Right border */
      50%  { transform: translate(830px, 265px) rotate(180deg); }  /* Turn Left */
      84%  { transform: translate(90px, 265px) rotate(180deg); }   /* End of Bottom border */
      88%  { transform: translate(90px, 265px) rotate(270deg); }   /* Turn Up */
      96%  { transform: translate(90px, 55px) rotate(270deg); }    /* End of Left border */
      100% { transform: translate(90px, 55px) rotate(360deg); }    /* Turn Right & loop */
    }

    /* 8-Leg Spider Tetrapod Gait Step Alternation */
    @keyframes spiderLegGaitA {
      0%, 100% { transform: rotate(-22deg); }
      50%      { transform: rotate(24deg); }
    }
    @keyframes spiderLegGaitB {
      0%, 100% { transform: rotate(24deg); }
      50%      { transform: rotate(-22deg); }
    }

    /* Spider Chelicerae (Fangs) Twitch & Snap */
    @keyframes fangSnapL {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(22deg); }
    }
    @keyframes fangSnapR {
      0%, 100% { transform: rotate(4deg); }
      50%      { transform: rotate(-22deg); }
    }

    /* Core Plasma Glow Pulse */
    @keyframes corePulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50%      { transform: scale(1.3); opacity: 0.7; }
    }

    /* Radar Scanner Sweep */
    @keyframes radarSweep {
      0%   { transform: rotate(-28deg); opacity: 0.3; }
      50%  { transform: rotate(32deg); opacity: 0.95; }
      100% { transform: rotate(-28deg); opacity: 0.3; }
    }

    /* Central Floating Data Tokens Breathing */
    @keyframes tokenPulse1 {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    @keyframes tokenPulse2 {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(4px); }
    }
    @keyframes tokenPulse3 {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }

    /* Laser Tether / Web Silk Spikes while spider crawls */
    @keyframes webSilkZap {
      0%, 100% { opacity: 0.15; stroke-dashoffset: 0; }
      50%      { opacity: 0.85; stroke-dashoffset: 20; }
    }

    .mecha-spider {
      animation: crawlPerimeter 18s linear infinite;
      transform-origin: center;
    }
    .sp-leg-a {
      animation: spiderLegGaitA 0.3s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .sp-leg-b {
      animation: spiderLegGaitB 0.3s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }
    .fang-l {
      animation: fangSnapL 1s ease-in-out infinite alternate;
      transform-origin: 30px -8px;
    }
    .fang-r {
      animation: fangSnapR 1s ease-in-out infinite alternate;
      transform-origin: 30px 8px;
    }
    .spider-core {
      animation: corePulse 1.2s ease-in-out infinite;
      transform-origin: -14px 0px;
    }
    .spider-radar {
      animation: radarSweep 2.2s ease-in-out infinite;
      transform-origin: 30px 0px;
    }
    .pulse-tok-1 { animation: tokenPulse1 3s ease-in-out infinite; }
    .pulse-tok-2 { animation: tokenPulse2 3.5s ease-in-out infinite; }
    .pulse-tok-3 { animation: tokenPulse3 2.8s ease-in-out infinite; }
    .laser-web { animation: webSilkZap 2s ease-in-out infinite; }
    /* ]]> */
  </style>

  <!-- Outer Cyber Border Frame with Perimeter Rail -->
  <rect width="920" height="320" rx="16" fill="url(#spiderBg)" stroke="#00f3ff" stroke-opacity="0.4" stroke-width="1.8"/>

  <!-- Perimeter Crawling Rail Track (Guides the spider cleanly) -->
  <rect x="50" y="35" width="820" height="250" rx="12" fill="none" stroke="#00f3ff" stroke-opacity="0.15" stroke-dasharray="8,6" stroke-width="1.2"/>

  <!-- High-Tech Matrix Background Grid -->
  <g opacity="0.06" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="40" x2="920" y2="40"/><line x1="0" y1="80" x2="920" y2="80"/>
    <line x1="0" y1="120" x2="920" y2="120"/><line x1="0" y1="160" x2="920" y2="160"/>
    <line x1="0" y1="200" x2="920" y2="200"/><line x1="0" y1="240" x2="920" y2="240"/>
    <line x1="0" y1="280" x2="920" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Cyber Motherboard Accent Lines -->
  <path d="M 25 35 L 200 35 L 230 65 L 450 65" stroke="url(#borderTrace)" stroke-width="1.6" fill="none"/>
  <circle cx="450" cy="65" r="3" fill="#00f3ff"/>
  <path d="M 895 285 L 720 285 L 690 255 L 470 255" stroke="url(#borderTrace)" stroke-width="1.6" fill="none"/>
  <circle cx="470" cy="255" r="3" fill="#00ff88"/>

  <!-- Status HUD Tag Header -->
  <g font-family="'Courier New', monospace" font-size="11.5" fill="#00f3ff" opacity="0.85">
    <text x="30" y="24" font-weight="bold">◈ ARACHNID_SENTINEL // PERIMETER_PATROL</text>
    <text x="715" y="304" font-weight="bold">AUTONOMOUS_HARVEST ◈</text>
  </g>

  <!-- ======================================================= -->
  <!-- CENTER CYBER WEB & FLOATING DATA TOKENS                 -->
  <!-- ======================================================= -->
  <!-- Digital Hex Web Strands linking center tokens -->
  <g class="laser-web" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4,4">
    <line x1="460" y1="160" x2="330" y2="120"/>
    <line x1="460" y1="160" x2="590" y2="120"/>
    <line x1="460" y1="160" x2="460" y2="230"/>
  </g>

  <!-- Token 1: #BugFixed -->
  <g transform="translate(330, 120)" class="pulse-tok-1">
    <rect x="-55" y="-14" width="110" height="28" rx="6" fill="#1c0717" stroke="#ff0077" stroke-width="1.6"/>
    <circle cx="-42" cy="0" r="3.5" fill="#ff0077"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12" fill="#ff4d94" text-anchor="middle" font-weight="bold">#BugFixed</text>
  </g>

  <!-- Token 2: Python3 -->
  <g transform="translate(460, 230)" class="pulse-tok-2">
    <rect x="-55" y="-14" width="110" height="28" rx="6" fill="#041528" stroke="#00f3ff" stroke-width="1.6"/>
    <circle cx="-42" cy="0" r="3.5" fill="#00f3ff"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12" fill="#00f3ff" text-anchor="middle" font-weight="bold">Python3</text>
  </g>

  <!-- Token 3: TriTechz -->
  <g transform="translate(590, 120)" class="pulse-tok-3">
    <rect x="-58" y="-14" width="116" height="28" rx="6" fill="#042616" stroke="#00ff88" stroke-width="1.6"/>
    <circle cx="-45" cy="0" r="3.5" fill="#00ff88"/>
    <text x="6" y="4" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" text-anchor="middle" font-weight="bold">TriTechz</text>
  </g>

  <!-- ======================================================= -->
  <!-- THE CYBER MECHA SPIDER (CRAWLS THE ENTIRE PERIMETER)    -->
  <!-- ======================================================= -->
  <g class="mecha-spider">

    <!-- Inward Radar Scanner Cone (Scanning interior from border) -->
    <g class="spider-radar">
      <polygon points="30,-2 150,-65 165,60" fill="url(#radarScanCone)" opacity="0.4"/>
      <line x1="30" y1="0" x2="155" y2="0" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.9"/>
      <circle cx="135" cy="0" r="6" stroke="#00ff88" stroke-width="1.3" fill="none"/>
      <circle cx="135" cy="0" r="2" fill="#00ff88"/>
    </g>

    <!-- ===================================================== -->
    <!-- 8 ARTICULATED SPIDER LEGS (4 ON EACH SIDE)            -->
    <!-- ===================================================== -->

    <!-- [LEG 1] Left Front (A) -->
    <g transform="translate(14, -12)">
      <g class="sp-leg-a">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L 18 -26" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 18 -26" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="18" cy="-26" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M 18 -26 L 42 -40" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="42" cy="-40" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 2] Left Mid-Front (B) -->
    <g transform="translate(4, -15)">
      <g class="sp-leg-b">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L 6 -28" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 6 -28" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="6" cy="-28" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M 6 -28 L 26 -46" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="26" cy="-46" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 3] Left Mid-Rear (A) -->
    <g transform="translate(-8, -15)">
      <g class="sp-leg-a">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L -8 -28" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -8 -28" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-8" cy="-28" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M -8 -28 L 4 -46" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="4" cy="-46" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 4] Left Rear (B) -->
    <g transform="translate(-18, -12)">
      <g class="sp-leg-b">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L -18 -24" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -18 -24" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-18" cy="-24" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M -18 -24 L -32 -40" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-32" cy="-40" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 5] Right Front (B) -->
    <g transform="translate(14, 12)">
      <g class="sp-leg-b">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L 18 26" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 18 26" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="18" cy="26" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M 18 26 L 42 40" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="42" cy="40" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 6] Right Mid-Front (A) -->
    <g transform="translate(4, 15)">
      <g class="sp-leg-a">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L 6 28" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L 6 28" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="6" cy="28" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M 6 28 L 26 46" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="26" cy="46" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 7] Right Mid-Rear (B) -->
    <g transform="translate(-8, 15)">
      <g class="sp-leg-b">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L -8 28" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -8 28" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-8" cy="28" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M -8 28 L 4 46" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="4" cy="46" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- [LEG 8] Right Rear (A) -->
    <g transform="translate(-18, 12)">
      <g class="sp-leg-a">
        <circle cx="0" cy="0" r="4.5" fill="#08101e" stroke="#00f3ff" stroke-width="1.8"/>
        <path d="M 0 0 L -18 24" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 0 0 L -18 24" stroke="#00f3ff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-18" cy="24" r="3.8" fill="#08101e" stroke="#00ff88" stroke-width="1.8"/>
        <path d="M -18 24 L -32 40" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-32" cy="40" r="2.5" fill="#00ff88"/>
      </g>
    </g>

    <!-- ===================================================== -->
    <!-- SPIDER BODY: CEPHALOTHORAX & OPISTHOSOMA (ABDOMEN)    -->
    <!-- ===================================================== -->

    <!-- Spider Abdomen (Opisthosoma) with Armor Plates -->
    <ellipse cx="-16" cy="0" rx="22" ry="16" fill="url(#chitinMetal)" stroke="#00f3ff" stroke-width="2.2"/>
    <line x1="-26" y1="-8" x2="-26" y2="8" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="-20" y1="-12" x2="-20" y2="12" stroke="#00f3ff" stroke-width="1.5"/>

    <!-- Spinneret Arc Reactor Core -->
    <circle cx="-14" cy="0" r="11" fill="#020617" stroke="#00ff88" stroke-width="2"/>
    <circle cx="-14" cy="0" r="8" fill="url(#spiderCoreGlow)" class="spider-core"/>
    <circle cx="-14" cy="0" r="2.8" fill="#ffffff"/>

    <!-- Spider Cephalothorax (Head/Chest Shield) -->
    <polygon points="4,-16 18,-9 18,9 4,16 -8,12 -8,-12" fill="url(#chitinMetal)" stroke="#00f3ff" stroke-width="2.4"/>
    <path d="M 0 -9 L 12 0 L 0 9" stroke="#00ff88" stroke-width="1.8" fill="none"/>

    <!-- Predatory 8-Eye Optic Cluster -->
    <!-- Central Main Visor Eyes -->
    <circle cx="16" cy="-4" r="3" fill="url(#spiderEyeGlow)"/>
    <circle cx="16" cy="4" r="3" fill="url(#spiderEyeGlow)"/>
    <circle cx="19" cy="0" r="2" fill="#00f3ff"/>
    <!-- Peripheral Ruby/Cyan Eyes -->
    <circle cx="11" cy="-7" r="1.6" fill="#ff0055"/>
    <circle cx="11" cy="7" r="1.6" fill="#ff0055"/>
    <circle cx="7" cy="-9" r="1.4" fill="#00ff88"/>
    <circle cx="7" cy="9" r="1.4" fill="#00ff88"/>

    <!-- Articulated Spider Chelicerae (Fangs) -->
    <g class="fang-l">
      <path d="M 18 -6 L 28 -12 L 32 -4" stroke="#00f3ff" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="32" cy="-4" r="1.8" fill="#00ff88"/>
    </g>
    <g class="fang-r">
      <path d="M 18 6 L 28 12 L 32 4" stroke="#00f3ff" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="32" cy="4" r="1.8" fill="#00ff88"/>
    </g>

    <!-- Cyber Feelers / Pedipalps -->
    <path d="M 18 -3 Q 26 -14 34 -15" stroke="#00f3ff" stroke-width="1.4" fill="none"/>
    <circle cx="34" cy="-15" r="1.8" fill="#00ffcc"/>

    <path d="M 18 3 Q 26 14 34 15" stroke="#00f3ff" stroke-width="1.4" fill="none"/>
    <circle cx="34" cy="15" r="1.8" fill="#00ffcc"/>
  </g>

</svg>
